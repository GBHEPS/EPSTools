<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPS Schedule Board v3</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #ffffff;
  --bg-secondary: #f5f4f0;
  --bg-tertiary: #eeede8;
  --text-primary: #1a1a18;
  --text-secondary: #5f5e5a;
  --text-tertiary: #8e8d87;
  --border-light: rgba(0,0,0,0.18);
  --border-mid: rgba(0,0,0,0.28);
  --border-strong: rgba(0,0,0,0.42);
  /* Walk = orange */
  --walk-bg: #FFF0DC;
  --walk-border: #E89020;
  --walk-text: #7A4A00;
  /* Fab = green */
  --fab-bg: #EAF3DE;
  --fab-border: #97C459;
  --fab-text: #27500A;
  /* Resto = blue */
  --resto-bg: #E6F1FB;
  --resto-border: #378ADD;
  --resto-text: #0C447C;
  /* Off = red */
  --red-bg: #FCEBEB;
  --red-border: #E24B4A;
  --red-text: #791F1F;
  --today-bg: #fffbf0;
  --today-border: #EF9F27;
  --orange-bg: #FFF3E0;
  --orange-border: #EF9F27;
  --orange-text: #7A4A00;
  --row-label-w: 90px;
  --cell-min-h: 80px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
}

body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-secondary); color: var(--text-primary); min-height: 100vh; }

header { background: var(--bg-primary); border-bottom: 0.5px solid var(--border-light); padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 60; }
header h1 { font-size: 13px; font-weight: 500; color: var(--text-secondary); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.header-divider { width: 0.5px; height: 20px; background: var(--border-light); }
.toolbar-btn { font-size: 11px; font-family: inherit; color: var(--text-secondary); background: var(--bg-secondary); border: 0.5px solid var(--border-mid); border-radius: var(--radius-sm); padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.toolbar-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.toolbar-btn.active { background: var(--bg-tertiary); color: var(--text-primary); border-color: var(--border-strong); }
.version-tag { font-size: 10px; color: var(--text-tertiary); font-family: monospace; padding: 3px 6px; background: var(--bg-tertiary); border-radius: 3px; }

.view-toggle { display: flex; border: 0.5px solid var(--border-mid); border-radius: var(--radius-sm); overflow: hidden; }
.view-toggle-btn { font-size: 11px; font-family: inherit; color: var(--text-secondary); background: var(--bg-secondary); border: none; border-right: 0.5px solid var(--border-mid); padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.view-toggle-btn:last-child { border-right: none; }
.view-toggle-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.view-toggle-btn.active { background: var(--text-primary); color: var(--bg-primary); }

.legend { display: flex; gap: 10px; align-items: center; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-secondary); }
.legend-dot { width: 9px; height: 9px; border-radius: 2px; }

.nav-wrap { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 0; }
.nav-week-label { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
.nav-controls { display: flex; align-items: center; gap: 8px; }
.nav-btn { width: 28px; height: 28px; border: 0.5px solid var(--border-mid); border-radius: var(--radius-sm); background: var(--bg-primary); color: var(--text-secondary); font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; }
.nav-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.nav-today-btn { font-size: 11px; font-family: inherit; color: var(--text-secondary); background: none; border: 0.5px solid var(--border-mid); border-radius: var(--radius-sm); padding: 5px 10px; cursor: pointer; }
.nav-today-btn:hover { background: var(--bg-tertiary); }

/* ── BOARD ── */
.board-outer { padding: 10px 16px 40px; }
.week-block { margin-bottom: 14px; }
.week-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-tertiary); padding: 6px 0 4px var(--row-label-w); }

/* ── JOB STRIP ── */
.job-strip-wrap { display: grid; grid-template-columns: var(--row-label-w) repeat(5, 1fr); margin-bottom: 4px; position: relative; min-height: 28px; }
.job-strip-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-tertiary); padding: 6px 6px 0 2px; display: flex; align-items: flex-start; white-space: nowrap; overflow: hidden; }
.job-strip-cells { grid-column: 2 / 7; position: relative; min-height: 28px; display: grid; grid-template-columns: repeat(5, 1fr); }
.job-strip-day-col { position: relative; }
.job-bar { position: absolute; top: 4px; height: 20px; background: var(--orange-bg); border: 0.5px solid var(--orange-border); border-radius: 3px; display: flex; align-items: center; padding: 0 6px; overflow: hidden; pointer-events: auto; cursor: pointer; z-index: 2; }
.job-bar:hover { opacity: 0.8; }
.job-bar.selected { outline: 2px solid var(--orange-border); outline-offset: 1px; }
.job-bar-label { font-size: 10px; font-weight: 600; color: var(--orange-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── GRID ── */
.grid-wrap { display: grid; grid-template-columns: var(--row-label-w) repeat(5, 1fr); border: 0.5px solid var(--border-mid); border-radius: var(--radius-md); overflow: visible; background: var(--bg-primary); position: relative; }
.row-label-header { background: var(--bg-tertiary); border-right: 0.5px solid var(--border-mid); border-bottom: 1px solid var(--border-mid); border-radius: var(--radius-md) 0 0 0; }
.day-header { background: var(--bg-tertiary); border-right: 0.5px solid var(--border-light); border-bottom: 1px solid var(--border-mid); padding: 6px 4px 5px; text-align: center; }
.day-header:last-child { border-right: none; border-radius: 0 var(--radius-md) 0 0; }
.day-name { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-tertiary); }
.day-date { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-top: 1px; }
.day-header.is-today { background: var(--today-bg); border-bottom-color: var(--today-border); }
.day-header.is-today .day-name { color: #BA7517; }
.day-header.is-today .day-date { color: #854F0B; }
.row-label { background: var(--bg-secondary); border-right: 0.5px solid var(--border-mid); border-bottom: 0.5px solid var(--border-light); padding: 8px 8px 8px 10px; display: flex; align-items: flex-start; font-size: 12px; font-weight: 600; color: var(--text-secondary); min-height: var(--cell-min-h); position: relative; z-index: 1; }
.emp-row-last .row-label { border-bottom: none; border-radius: 0 0 0 var(--radius-md); }
.emp-row-last .day-cell { border-bottom: none; }
.emp-row-last .day-cell:last-child { border-radius: 0 0 var(--radius-md) 0; }
.day-cell { border-right: 0.5px solid var(--border-light); border-bottom: 0.5px solid var(--border-light); min-height: var(--cell-min-h); padding: 4px; position: relative; cursor: pointer; }
.day-cell:last-child { border-right: none; }
.day-cell.is-today { background: var(--today-bg); }
.day-cell:hover { background: var(--bg-secondary); }
.day-cell.is-today:hover { background: #fff8e6; }
.day-cell.drag-over { background: var(--fab-bg); outline: 1.5px dashed var(--fab-border); outline-offset: -2px; }

/* ── CARDS ── */
.scard { position: absolute; top: 4px; left: 4px; right: 4px; border-radius: var(--radius-sm); padding: 4px 24px 4px 6px; font-size: 11px; cursor: grab; user-select: none; z-index: 10; min-height: 36px; display: flex; flex-direction: column; gap: 1px; overflow: hidden; }
.scard:active { cursor: grabbing; }
.scard.dragging { opacity: 0.3; }
.scard + .scard { top: auto; }
/* New types */
.scard-walk  { background: var(--walk-bg);  border: 0.5px solid var(--walk-border);  color: var(--walk-text); }
.scard-fab   { background: var(--fab-bg);   border: 0.5px solid var(--fab-border);   color: var(--fab-text); }
.scard-resto { background: var(--resto-bg); border: 0.5px solid var(--resto-border); color: var(--resto-text); }
.scard-off   { background: var(--red-bg);   border: 0.5px solid var(--red-border);   color: var(--red-text); }
/* Legacy fallbacks — old shop/site cards still render with color */
.scard-shop  { background: var(--fab-bg);   border: 0.5px solid var(--fab-border);   color: var(--fab-text); }
.scard-site  { background: var(--resto-bg); border: 0.5px solid var(--resto-border); color: var(--resto-text); }
.scard-name  { font-weight: 600; font-size: 11px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scard-desc  { font-size: 10px; font-weight: 400; opacity: 0.85; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scard-span  { font-size: 9px; font-weight: 500; opacity: 0.65; margin-top: 1px; }
.scard-btns  { position: absolute; top: 3px; right: 3px; display: flex; gap: 2px; opacity: 0; transition: opacity 0.1s; }
.scard:hover .scard-btns { opacity: 1; }
.scard-btn   { width: 16px; height: 16px; border-radius: 2px; border: none; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; line-height: 1; }
.scard-walk  .scard-btn, .scard-shop .scard-btn { background: rgba(39,80,10,0.14);   color: var(--fab-text); }
.scard-fab   .scard-btn  { background: rgba(39,80,10,0.14);   color: var(--fab-text); }
.scard-resto .scard-btn, .scard-site .scard-btn { background: rgba(12,68,124,0.14);  color: var(--resto-text); }
.scard-off   .scard-btn  { background: rgba(121,31,31,0.14);  color: var(--red-text); }
.scard-btn:hover { opacity: 0.65; }
.scard.selected { outline: 2px solid var(--text-primary); outline-offset: 1px; }
.scard-walk.selected  { outline-color: var(--walk-border); }
.scard-fab.selected, .scard-shop.selected  { outline-color: var(--fab-border); }
.scard-resto.selected, .scard-site.selected { outline-color: var(--resto-border); }
.scard-off.selected   { outline-color: var(--red-border); }
.paste-ready .day-cell { cursor: copy; }
.paste-ready .day-cell:hover { background: var(--fab-bg); outline: 1.5px dashed var(--fab-border); outline-offset: -2px; }
.month-job-bar.selected { outline: 2px solid var(--orange-border); outline-offset: 1px; z-index: 10; }
.paste-ready-month .month-day-cell { cursor: copy; }
.paste-ready-month .month-day-cell:hover { background: var(--fab-bg); outline: 1.5px dashed var(--fab-border); outline-offset: -2px; }

/* ── MINI CALENDAR ── */
.mini-cal { display: none; background: var(--bg-primary); border: 0.5px solid var(--border-mid); border-radius: var(--radius-md); padding: 5px 6px; }
.mini-cal.visible { display: flex; gap: 10px; align-items: flex-start; }
.mini-cal-header { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-tertiary); text-align: center; margin-bottom: 3px; }
.mini-cal-grid { display: grid; grid-template-columns: repeat(5, 16px); gap: 1px; }
.mini-cal-day { font-size: 8px; text-align: center; line-height: 14px; height: 14px; border-radius: 2px; cursor: pointer; color: var(--text-secondary); }
.mini-cal-day:hover { background: var(--bg-tertiary); }
.mini-cal-day.other-month { color: var(--text-tertiary); opacity: 0.35; }
.mini-cal-day.is-today { font-weight: 700; color: #854F0B; }
.mini-cal-day.in-window { background: rgba(0,0,0,0.09); color: var(--text-primary); font-weight: 600; }
.mini-cal-day.in-window:hover { background: rgba(0,0,0,0.16); }
.mini-cal-month-block { }


.month-outer { padding: 10px 16px 40px; }
.month-grid { background: var(--bg-primary); border: 0.5px solid var(--border-mid); border-radius: var(--radius-md); overflow: hidden; }
.month-header-row { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--border-mid); background: var(--bg-tertiary); }
.month-col-header { padding: 6px 4px 5px; text-align: center; border-right: 0.5px solid var(--border-light); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-tertiary); }
.month-col-header:last-child { border-right: none; }
.month-week-row { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 0.5px solid var(--border-light); min-height: 80px; position: relative; }
.month-week-row:last-child { border-bottom: none; }
.month-day-cell { border-right: 0.5px solid var(--border-light); padding: 4px 5px 24px; position: relative; min-height: 80px; }
.month-day-cell:last-child { border-right: none; }
.month-day-cell.other-month .month-day-num { color: var(--text-tertiary); opacity: 0.4; }
.month-day-cell.is-today { background: var(--today-bg); }
.month-day-num { font-size: 11px; font-weight: 500; color: var(--text-secondary); line-height: 1; margin-bottom: 2px; }
.month-day-cell.is-today .month-day-num { color: #854F0B; font-weight: 700; }
.month-job-bar { position: absolute; height: 22px; background: var(--orange-bg); border: 0.5px solid var(--orange-border); border-radius: 3px; display: flex; align-items: center; padding: 0 6px; overflow: hidden; pointer-events: auto; z-index: 5; cursor: pointer; user-select: none; }
.month-job-bar-inner { display: flex; align-items: center; gap: 5px; min-width: 0; width: 100%; }
.month-job-bar-name { font-size: 10px; font-weight: 600; color: var(--orange-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.month-job-bar-initials { font-size: 9px; font-weight: 500; color: var(--orange-text); opacity: 0.75; white-space: nowrap; flex-shrink: 0; }

/* ── MODALS ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--bg-primary); border: 0.5px solid var(--border-mid); border-radius: var(--radius-lg); padding: 22px; width: 340px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); max-height: 90vh; overflow-y: auto; }
.modal h3 { font-size: 14px; font-weight: 500; margin-bottom: 14px; color: var(--text-primary); }
.modal label { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 4px; margin-top: 10px; }
.modal label:first-of-type { margin-top: 0; }
.modal input[type="text"], .modal input[type="date"], .modal input[type="number"] { width: 100%; border: 0.5px solid var(--border-mid); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; font-family: inherit; color: var(--text-primary); background: var(--bg-primary); outline: none; }
.modal input:focus { border-color: var(--border-strong); }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.modal-btns button { font-size: 13px; padding: 7px 16px; border-radius: var(--radius-sm); border: 0.5px solid var(--border-mid); background: var(--bg-primary); color: var(--text-primary); cursor: pointer; font-family: inherit; }
.modal-btns button:hover { background: var(--bg-secondary); }
.btn-primary { background: var(--text-primary) !important; color: var(--bg-primary) !important; border-color: var(--text-primary) !important; }
.btn-primary:hover { opacity: 0.82 !important; }
.btn-danger { background: #c0392b !important; color: #fff !important; border-color: #c0392b !important; }
.btn-danger:hover { opacity: 0.85 !important; }
.type-btns { display: flex; gap: 6px; }
.type-btn { flex: 1; padding: 7px 4px; border-radius: var(--radius-sm); border: 0.5px solid var(--border-mid); background: var(--bg-secondary); font-size: 12px; font-family: inherit; cursor: pointer; font-weight: 500; color: var(--text-secondary); }
.type-btn.active-walk  { background: var(--walk-bg);  color: var(--walk-text);  border-color: var(--walk-border); }
.type-btn.active-fab   { background: var(--fab-bg);   color: var(--fab-text);   border-color: var(--fab-border); }
.type-btn.active-resto { background: var(--resto-bg); color: var(--resto-text); border-color: var(--resto-border); }
.type-btn.active-off   { background: var(--red-bg);   color: var(--red-text);   border-color: var(--red-border); }
.modal-note-text { font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; line-height: 1.5; }
.priority-hint { font-size: 11px; color: var(--text-tertiary); margin-top: 3px; font-style: italic; }
.client-list-wrap { max-height: 260px; overflow-y: auto; border: 0.5px solid var(--border-light); border-radius: var(--radius-sm); margin-top: 4px; }
.client-list-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-bottom: 0.5px solid var(--border-light); font-size: 13px; color: var(--text-primary); }
.client-list-item:last-child { border-bottom: none; }
.client-del-btn { width: 18px; height: 18px; border-radius: 3px; border: none; background: var(--bg-tertiary); color: var(--text-tertiary); font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; flex-shrink: 0; }
.client-del-btn:hover { background: #fdecea; color: #c0392b; }
.client-empty { font-size: 12px; color: var(--text-tertiary); padding: 12px 10px; text-align: center; }

#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--text-primary); color: var(--bg-primary); font-size: 12px; padding: 8px 18px; border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 300; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── PRINT ── */
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  header, .nav-wrap, #toast, .modal-overlay { display: none !important; }
  body { background: white; }
  .board-outer { padding: 4px 8px 8px; }
  .month-outer { padding: 4px 8px 8px; }
  .week-block { margin-bottom: 10px; page-break-inside: avoid; }
  .job-strip-wrap { min-height: 24px; }
  .job-bar { height: 16px; top: 3px; }
  .job-bar-label { font-size: 9px; }
  :root { --row-label-w: 72px; --cell-min-h: 64px; }
  .day-header { padding: 4px 3px; }
  .day-name { font-size: 12px; } .day-date { font-size: 17px; margin-top: 1px; }
  .row-label { font-size: 16px; font-weight: 600; padding: 5px 5px 5px 7px; min-height: var(--cell-min-h); }
  .day-cell { min-height: var(--cell-min-h); padding: 3px; }
  .scard { padding: 3px 5px; min-height: 32px; border-radius: 3px; background: white !important; }
  .scard-walk  { border: 2px solid var(--walk-border)  !important; color: var(--walk-text)  !important; }
  .scard-fab, .scard-shop  { border: 2px solid var(--fab-border)   !important; color: var(--fab-text)   !important; }
  .scard-resto, .scard-site { border: 2px solid var(--resto-border) !important; color: var(--resto-text) !important; }
  .scard-off   { border: 2px solid var(--red-border)   !important; color: var(--red-text)   !important; }
  .scard-name { font-size: 16px; } .scard-desc { font-size: 12px; } .scard-span { font-size: 11px; }
  .scard-btns { display: none; }
  .month-job-bar { border: 1.5px solid #EF9F27 !important; background: white !important; }
}
</style>
</head>
<body>

<header>
  <h1>East Portland Sash &mdash; Schedule Board</h1>
  <span class="version-tag">v3</span>
</header>

<!-- Unified control strip -->
<div id="control-strip" style="background:var(--bg-primary);border-bottom:0.5px solid var(--border-light);padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;position:sticky;top:37px;z-index:55;">

  <!-- Nav arrows + label -->
  <div style="display:flex;flex-direction:column;gap:3px;flex-shrink:0;">
    <button class="nav-btn" id="btn-prev" title="Previous (←)">&#9650;</button>
    <button class="nav-btn" id="btn-next" title="Next (→)">&#9660;</button>
  </div>
  <div style="flex-shrink:0;min-width:80px;">
    <div class="nav-week-label" id="nav-label"></div>
    <div class="nav-week-label" id="nav-month-label" style="display:none;"></div>
    <button class="nav-today-btn" id="btn-today" style="margin-top:4px;">Today</button>
    <button class="nav-today-btn" id="btn-month-today" style="margin-top:4px;display:none;">This month</button>
  </div>

  <div class="header-divider"></div>

  <!-- Mini calendar (2-week only) -->
  <div class="mini-cal visible" id="mini-cal"></div>

  <!-- Spacer -->
  <div style="flex:1;"></div>

  <!-- Legend -->
  <div class="legend" style="flex-shrink:0;">
    <div class="legend-item"><div class="legend-dot" style="background:var(--walk-border);"></div> Walk</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--fab-border);"></div> Fab</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--resto-border);"></div> Resto</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--red-border);"></div> Off</div>
  </div>

  <div class="header-divider"></div>

  <!-- View toggle -->
  <div class="view-toggle" style="flex-shrink:0;">
    <button class="view-toggle-btn active" id="btn-view-2week">2-Week</button>
    <button class="view-toggle-btn" id="btn-view-month">Month</button>
  </div>

  <!-- Keyboard hint -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBiwsuVyEormZua4fUh7rLeIAQp0BZ-y8A",
  authDomain: "epstools-2913e.firebaseapp.com",
  projectId: "epstools-2913e",
  storageBucket: "epstools-2913e.firebasestorage.app",
  messagingSenderId: "91969549327",
  appId: "1:91969549327:web:6eea1d04d68eb01dabdf7a"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const DOC_REF = doc(db, "boards", "schedule");
const PM_COLL = "pm_projects";

const FIXED_EMPLOYEES = ["AB","SF","AP","AS","MW","GH"];
const FLOATER_DEFAULTS = ["FA","FB"];
let floaterNames = [...FLOATER_DEFAULTS];
const DAYS = ["Mon","Tue","Wed","Thu","Fri"];
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const INITIALS_MAP = { "AB":"AB","SF":"SF","AP":"AP","AS":"AS","MW":"MW","GH":"GH" };
function getInitials(empName) {
  if (INITIALS_MAP[empName]) return INITIALS_MAP[empName];
  // Floaters and custom names — take first letters
  const parts = empName.trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return parts[0].slice(0,2).toUpperCase();
}
function getEmployees() { return [...FIXED_EMPLOYEES, ...floaterNames]; }

// Normalize legacy card types
function normalizeType(t) {
  if (t === 'shop') return 'fab';
  if (t === 'site') return 'resto';
  return t || 'fab';
}

// ── VIEW STATE ──
let currentView = "2week";
let showJobStrip = true;
const now = new Date();
let monthAnchor = { year: now.getFullYear(), month: now.getMonth() };

// ── DATE UTILS ──
function getMondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }
function dateKey(date) {
  const d = new Date(date);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fromKey(key) { const [y,m,d] = key.split("-").map(Number); return new Date(y, m-1, d); }
function fmt(date) { return (date.getMonth()+1) + "/" + date.getDate(); }
function isToday(date) { const t = new Date(); return date.getFullYear()===t.getFullYear()&&date.getMonth()===t.getMonth()&&date.getDate()===t.getDate(); }
function daysBetween(startKey, endKey) { return Math.round((fromKey(endKey) - fromKey(startKey)) / 86400000); }
function addBusinessDays(startKey, n) {
  let d = fromKey(startKey);
  let added = 0;
  while (added < n) { d = addDays(d, 1); const dow = d.getDay(); if (dow !== 0 && dow !== 6) added++; }
  return dateKey(d);
}

// ── STATE ──
let anchorMonday = getMondayOf(new Date());
let cards = [];
let prodClients = [];
let editId = null;
let addContext = null;
let selectedCardId = null;
let copiedCard = null;
let selectedJobBar = null;
let copiedJobBar = null;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

async function loadState() {
  try {
    const snap = await getDoc(DOC_REF);
    if (snap.exists()) {
      const s = snap.data();
      cards = s.cards || [];
      prodClients = s.prodClients || [];
      floaterNames = s.floaterNames || [...FLOATER_DEFAULTS];
      if (s.anchorMonday) anchorMonday = fromKey(s.anchorMonday);
    }
  } catch(e) { console.warn("Firestore load failed", e); }
}

let saveTimer = null;
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await setDoc(DOC_REF, { cards, prodClients, floaterNames, anchorMonday: dateKey(anchorMonday) });
      syncDatesToPM();
    } catch(e) { console.warn("Firestore save failed", e); toast("Auto-save failed — check connection."); }
  }, 800);
}

// ── PM SYNC ──
async function syncDatesToPM() {
  const priorityIds = [...new Set(cards.filter(c => c.priorityId).map(c => c.priorityId))];
  if (!priorityIds.length) return;
  for (const pid of priorityIds) {
    const linked = cards.filter(c => c.priorityId === pid && c.type !== 'off');
    if (!linked.length) continue;
    try {
      const fabCards   = linked.filter(c => normalizeType(c.type) === 'fab');
      const restoCards = linked.filter(c => normalizeType(c.type) === 'resto');
      const walkCards  = linked.filter(c => normalizeType(c.type) === 'walk');
      const fabStart   = fabCards.length   ? fabCards.sort((a,b)=>a.startDate.localeCompare(b.startDate))[0].startDate   : null;
      const restoStart = restoCards.length ? restoCards.sort((a,b)=>a.startDate.localeCompare(b.startDate))[0].startDate : null;
      const walkDate   = walkCards.length  ? walkCards.sort((a,b)=>a.startDate.localeCompare(b.startDate))[0].startDate  : null;
      const pmSnap = await getDocs(query(collection(db, PM_COLL), where("priority", "==", pid)));
      for (const pmDoc of pmSnap.docs) {
        const update = {};
        if (fabStart)   update.fabStart   = fabStart;
        if (restoStart) update.restoStart = restoStart;
        if (walkDate)   update.startDate  = walkDate;
        if (Object.keys(update).length) await setDoc(pmDoc.ref, update, { merge: true });
      }
    } catch(e) { console.warn("PM sync failed for priority", pid, e); }
  }
}

async function lookupPMProject(priorityNum) {
  if (!priorityNum) return null;
  try {
    const snap = await getDocs(query(collection(db, PM_COLL), where("priority", "==", priorityNum)));
    if (snap.empty) return null;
    return snap.docs[0].data();
  } catch(e) { return null; }
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._to);
  t._to = setTimeout(() => t.classList.remove("show"), 2400);
}

// ── VIEW SWITCHING ──
function setView(view) {
  currentView = view;
  if (view === "month") {
    monthAnchor = { year: anchorMonday.getFullYear(), month: anchorMonday.getMonth() };
  } else {
    anchorMonday = getMondayOf(new Date(monthAnchor.year, monthAnchor.month, 1));
  }
  document.getElementById("btn-view-2week").classList.toggle("active", view === "2week");
  document.getElementById("btn-view-month").classList.toggle("active", view === "month");
  document.getElementById("board-outer").style.display  = view === "2week" ? "" : "none";
  document.getElementById("month-outer").style.display  = view === "month" ? "" : "none";
  document.getElementById("btn-toggle-jobs").style.display = view === "2week" ? "" : "none";
  // Nav labels
  document.getElementById("nav-label").style.display        = view === "2week" ? "" : "none";
  document.getElementById("nav-month-label").style.display  = view === "month" ? "" : "none";
  document.getElementById("btn-today").style.display        = view === "2week" ? "" : "none";
  document.getElementById("btn-month-today").style.display  = view === "month" ? "" : "none";
  // Mini cal
  const miniCal = document.getElementById("mini-cal");
  if (view === "2week") { miniCal.classList.add("visible"); miniCal.style.display = ""; }
  else                  { miniCal.style.display = "none"; }
  if (view === "2week") { renderBoard(); renderMiniCal(); }
  else                  { renderMonth(); }
}
document.getElementById("btn-view-2week").addEventListener("click", () => setView("2week"));
document.getElementById("btn-view-month").addEventListener("click", () => setView("month"));

// ── MINI CALENDAR ──
function renderMiniCal() {
  const el = document.getElementById("mini-cal");
  if (!el) return;
  el.innerHTML = "";

  // Determine which months to show
  const w1Mon = anchorMonday;
  const w2Mon = addDays(anchorMonday, 7);
  const w2Fri = addDays(anchorMonday, 11);

  // The 2-week window spans these dates
  const windowStart = dateKey(w1Mon);
  const windowEnd   = dateKey(w2Fri);

  // Get unique months in the window
  const months = [];
  const m1 = { year: w1Mon.getFullYear(), month: w1Mon.getMonth() };
  const m2 = { year: w2Fri.getFullYear(), month: w2Fri.getMonth() };
  months.push(m1);
  if (m2.year !== m1.year || m2.month !== m1.month) months.push(m2);

  months.forEach(({ year, month }) => {
    const block = document.createElement("div");
    block.className = "mini-cal-month-block";

    const hdr = document.createElement("div");
    hdr.className = "mini-cal-header";
    hdr.textContent = MONTH_NAMES[month].slice(0,3) + " " + year;
    block.appendChild(hdr);

    const grid = document.createElement("div");
    grid.className = "mini-cal-grid";

    // Get Mon-Fri for 4 weeks starting from first Monday of month
    const firstDay = new Date(year, month, 1);
    const startMon = getMondayOf(firstDay);

    for (let week = 0; week < 4; week++) {
      for (let day = 0; day < 5; day++) { // Mon-Fri only
        const cursor = addDays(startMon, week * 7 + day);
        const dk = dateKey(cursor);
        const inMonth = cursor.getMonth() === month;
        const inWin   = dk >= windowStart && dk <= windowEnd;
        const isTod   = isToday(cursor);

        const d = document.createElement("div");
        d.className = "mini-cal-day"
          + (!inMonth ? " other-month" : "")
          + (isTod    ? " is-today"    : "")
          + (inWin    ? " in-window"   : "");
        d.textContent = cursor.getDate();

        const clickDate = new Date(cursor);
        d.addEventListener("click", () => {
          anchorMonday = getMondayOf(clickDate);
          if (currentView !== "2week") setView("2week");
          else { renderBoard(); renderMiniCal(); saveState(); }
        });

        grid.appendChild(d);
      }
    }

    block.appendChild(grid);
    el.appendChild(block);
  });
}

// ── JOB STRIP ──
function getJobsForWeek(weekDates) {
  const weekStart = dateKey(weekDates[0]);
  const weekEnd   = dateKey(weekDates[4]);
  const jobMap = {};
  cards.forEach(c => {
    if (c.type === "off" || !c.client) return;
    if (c.endDate < weekStart || c.startDate > weekEnd) return;
    if (!jobMap[c.client]) { jobMap[c.client] = { client: c.client, startDate: c.startDate, endDate: c.endDate }; }
    else {
      if (c.startDate < jobMap[c.client].startDate) jobMap[c.client].startDate = c.startDate;
      if (c.endDate   > jobMap[c.client].endDate)   jobMap[c.client].endDate   = c.endDate;
    }
  });
  return Object.values(jobMap);
}

function jobColRange(job, weekDates) {
  const weekStart = dateKey(weekDates[0]);
  const weekEnd   = dateKey(weekDates[4]);
  const clampedStart = job.startDate < weekStart ? weekStart : job.startDate;
  const clampedEnd   = job.endDate   > weekEnd   ? weekEnd   : job.endDate;
  let startCol = -1, endCol = -1;
  weekDates.forEach((d, i) => {
    const dk = dateKey(d);
    if (startCol < 0 && dk >= clampedStart) startCol = i;
    if (dk <= clampedEnd) endCol = i;
  });
  if (startCol < 0) startCol = 0;
  if (endCol   < 0) endCol   = 4;
  return { startCol, endCol };
}

function renderJobStrip(weekBlock, weekDates) {
  const existing = weekBlock.querySelector(".job-strip-wrap");
  if (existing) existing.remove();
  if (!showJobStrip) return;
  const jobs = getJobsForWeek(weekDates);
  if (jobs.length === 0) return;
  jobs.sort((a, b) => a.startDate.localeCompare(b.startDate));
  const rows = [];
  const barPlacements = jobs.map(job => {
    const { startCol, endCol } = jobColRange(job, weekDates);
    let rowIdx = rows.findIndex(rowEndCol => rowEndCol < startCol);
    if (rowIdx < 0) { rowIdx = rows.length; rows.push(endCol); } else { rows[rowIdx] = endCol; }
    return { job, startCol, endCol, rowIdx };
  });
  const barH = 20, barGap = 3;
  const stripH = rows.length * (barH + barGap) + 4;
  const stripWrap = document.createElement("div");
  stripWrap.className = "job-strip-wrap";
  stripWrap.style.minHeight = stripH + "px";
  const stripLabel = document.createElement("div");
  stripLabel.className = "job-strip-label";
  stripLabel.textContent = "Jobs";
  stripWrap.appendChild(stripLabel);
  const stripCells = document.createElement("div");
  stripCells.className = "job-strip-cells";
  stripCells.style.minHeight = stripH + "px";
  for (let i = 0; i < 5; i++) {
    const col = document.createElement("div");
    col.className = "job-strip-day-col";
    col.dataset.col = i;
    stripCells.appendChild(col);
  }
  stripWrap.appendChild(stripCells);
  const weekLabel = weekBlock.querySelector(".week-label");
  weekLabel.insertAdjacentElement("afterend", stripWrap);
  requestAnimationFrame(() => {
    const colEls = stripCells.querySelectorAll(".job-strip-day-col");
    barPlacements.forEach(({ job, startCol, endCol, rowIdx }) => {
      if (!colEls[startCol]) return;
      const startRect = colEls[startCol].getBoundingClientRect();
      const endRect   = colEls[endCol].getBoundingClientRect();
      const stripRect = stripCells.getBoundingClientRect();
      const left  = startRect.left - stripRect.left + 2;
      const width = endRect.right  - startRect.left - 4;
      const top   = 4 + rowIdx * (barH + barGap);
      const bar = document.createElement("div");
      bar.className = "job-bar";
      bar.style.left = left + "px"; bar.style.width = width + "px";
      bar.style.top = top + "px";   bar.style.height = barH + "px";
      const label = document.createElement("span");
      label.className = "job-bar-label";
      label.textContent = job.client;
      bar.appendChild(label);
      bar.addEventListener("click", e => {
        e.stopPropagation();
        document.querySelectorAll(".scard.selected").forEach(s => s.classList.remove("selected"));
        selectedCardId = null;
        document.querySelectorAll(".job-bar.selected, .month-job-bar.selected").forEach(b => b.classList.remove("selected"));
        bar.classList.add("selected");
        copiedCard = null; copiedJobBar = null;
        document.getElementById("board-outer").classList.remove("paste-ready");
        document.getElementById("month-outer").classList.remove("paste-ready-month");
        // Build selectedJobBar from matching cards in this week
        const weekStart = dateKey(weekDates[0]);
        const weekEnd   = dateKey(weekDates[4]);
        const matchingCards = cards.filter(c => c.client === job.client && c.type !== 'off' && c.startDate <= weekEnd && c.endDate >= weekStart);
        const primaryType  = matchingCards.length ? normalizeType(matchingCards[0].type) : 'fab';
        const emps         = [...new Set(matchingCards.map(c => c.emp))];
        const cardIds      = matchingCards.map(c => c.id);
        const desc         = matchingCards.map(c => c.desc).find(d => d) || '';
        const priorityId   = matchingCards.map(c => c.priorityId).find(p => p) || null;
        selectedJobBar = { client: job.client, type: primaryType, emps, cardIds, startDate: job.startDate, endDate: job.endDate, desc, priorityId };
        toast(`"${job.client}" selected — Ctrl+C to copy, Ctrl+E to edit.`);
      });
      stripCells.appendChild(bar);
    });
  });
}

// ── MONTH VIEW ──
function getMonthWeeks(year, month) {
  const firstDay = new Date(year, month, 1);
  const lastDay  = new Date(year, month + 1, 0);
  const monday   = getMondayOf(firstDay);
  const weeks    = [];
  let cursor     = new Date(monday);
  while (cursor <= lastDay || weeks.length === 0) {
    const week = [];
    for (let i = 0; i < 7; i++) { week.push(new Date(cursor)); cursor = addDays(cursor, 1); }
    weeks.push(week);
    if (cursor > lastDay && weeks.length >= 4) break;
  }
  return weeks;
}

function getBarColors(type) {
  if (type === 'fab')   return { bg: 'var(--fab-bg)',   border: 'var(--fab-border)',   text: 'var(--fab-text)' };
  if (type === 'resto') return { bg: 'var(--resto-bg)', border: 'var(--resto-border)', text: 'var(--resto-text)' };
  return { bg: 'var(--walk-bg)', border: 'var(--walk-border)', text: 'var(--walk-text)' };
}

// Build consolidated bars: one per (client, normalizedType) spanning all cards of that type
function getMonthBars(year, month) {
  // Expand window slightly to catch bars starting end of prev month or ending start of next
  const windowStart = dateKey(new Date(year, month, 1));
  const windowEnd   = dateKey(new Date(year, month + 1, 14)); // look 2 weeks into next month
  const prevEnd     = dateKey(new Date(year, month, 0));       // last day of prev month
  const barMap = {};
  cards.forEach(c => {
    if (c.type === 'off' || !c.client) return;
    // Include if card overlaps with this month OR starts in prev month and ends in this month's view
    if (c.endDate < windowStart || c.startDate > windowEnd) return;
    const type = normalizeType(c.type);
    const key  = c.client + '||' + type;
    if (!barMap[key]) {
      barMap[key] = {
        key, client: c.client, type,
        priorityId: c.priorityId || null,
        startDate: c.startDate, endDate: c.endDate,
        emps: new Set(), cardIds: []
      };
    }
    const b = barMap[key];
    if (c.startDate < b.startDate) b.startDate = c.startDate;
    if (c.endDate   > b.endDate)   b.endDate   = c.endDate;
    b.emps.add(getInitials(c.emp));
    b.cardIds.push(c.id);
  });
  return Object.values(barMap)
    .map(b => ({ ...b, emps: Array.from(b.emps).join(' ') }))
    .sort((a,b) => a.startDate.localeCompare(b.startDate));
}

let _monthDragBar = null;

function renderMonth() {
  const outer = document.getElementById("month-outer");
  outer.innerHTML = "";
  const { year, month } = monthAnchor;
  document.getElementById("nav-month-label").textContent = MONTH_NAMES[month] + " " + year;
  const weeks   = getMonthWeeks(year, month).slice(0, 6); // 6 rows
  const allBars = getMonthBars(year, month);

  const grid = document.createElement("div");
  grid.className = "month-grid";

  // Header — Mon-Fri only
  const headerRow = document.createElement("div");
  headerRow.className = "month-header-row";
  ["Mon","Tue","Wed","Thu","Fri"].forEach(d => {
    const h = document.createElement("div");
    h.className = "month-col-header";
    h.textContent = d;
    headerRow.appendChild(h);
  });
  grid.appendChild(headerRow);

  weeks.forEach(weekDays => {
    const wkStart = dateKey(weekDays[0]);
    const wkEnd   = dateKey(weekDays[4]);

    const weekRow = document.createElement("div");
    weekRow.className = "month-week-row";

    // Day cells — Mon-Fri only (indices 0-4)
    weekDays.slice(0, 5).forEach((d, di) => {
      const cell = document.createElement("div");
      const inMonth = d.getMonth() === month && d.getFullYear() === year;
      cell.className = "month-day-cell"
        + (!inMonth ? " other-month" : "")
        + (isToday(d) ? " is-today" : "");
      cell.dataset.day = dateKey(d);
      const num = document.createElement("div");
      num.className = "month-day-num";
      num.textContent = d.getDate();
      cell.appendChild(num);
      // Click empty day to add card
      cell.addEventListener("click", e => {
        if (e.target.closest(".month-job-bar")) return;
        openAddModal(getEmployees()[0], dateKey(d));
      });
      weekRow.appendChild(cell);
    });
    grid.appendChild(weekRow);

    const weekBars = allBars.filter(b =>
      b.endDate >= wkStart && b.startDate <= wkEnd
    );
    if (!weekBars.length) { grid.appendChild(weekRow); return; }

    const barRows = [];
    const placements = weekBars.map(bar => {
      const clampStart     = bar.startDate < wkStart ? wkStart : bar.startDate;
      const clampEnd       = bar.endDate   > wkEnd   ? wkEnd   : bar.endDate;
      const continuesLeft  = bar.startDate < wkStart;
      const continuesRight = bar.endDate   > wkEnd;
      let startCol = -1, endCol = -1;
      weekDays.slice(0,5).forEach((d, i) => {
        const dk = dateKey(d);
        if (startCol < 0 && dk >= clampStart) startCol = i;
        if (dk <= clampEnd) endCol = i;
      });
      if (startCol < 0) startCol = 0;
      if (endCol   < 0) endCol   = 4;
      let rowIdx = barRows.findIndex(r => r < startCol);
      if (rowIdx < 0) { rowIdx = barRows.length; barRows.push(endCol); }
      else            { barRows[rowIdx] = endCol; }
      return { bar, startCol, endCol, rowIdx, continuesLeft, continuesRight };
    });

    const barH = 24, barGap = 3, barTopOffset = 20;
    const neededH = barTopOffset + barRows.length * (barH + barGap) + 8;
    if (neededH > 80) weekRow.style.minHeight = neededH + "px";

    requestAnimationFrame(() => {
      const allCells = weekRow.querySelectorAll(".month-day-cell");
      if (!allCells.length) return;
      const rowRect = weekRow.getBoundingClientRect();

      placements.forEach(({ bar, startCol, endCol, rowIdx, continuesLeft, continuesRight }) => {
        const startCell = allCells[startCol];
        const endCell   = allCells[endCol];
        if (!startCell || !endCell) return;

        const startRect = startCell.getBoundingClientRect();
        const endRect   = endCell.getBoundingClientRect();
        // Bars continuing from prev week start at left edge; continuing to next week end at right edge
        const left  = continuesLeft  ? 0 : startRect.left - rowRect.left + 3;
        const right = continuesRight ? rowRect.right - rowRect.left : endRect.right - rowRect.left - 3;
        const width = right - left;
        const top   = barTopOffset + rowIdx * (barH + barGap);
        const colors = getBarColors(bar.type);

        const el = document.createElement("div");
        el.className = "month-job-bar";
        // Flatten corners on continuation edges
        const borderRadius = `${continuesLeft ? '0' : '3px'} ${continuesRight ? '0' : '3px'} ${continuesRight ? '0' : '3px'} ${continuesLeft ? '0' : '3px'}`;
        el.style.cssText = `left:${left}px;width:${width}px;top:${top}px;height:${barH}px;`
          + `background:${colors.bg};border-color:${colors.border};cursor:grab;border-radius:${borderRadius};`
          + (continuesLeft  ? 'border-left:none;' : '')
          + (continuesRight ? 'border-right:none;' : '');
        el.draggable = false;
        el.dataset.barKey = bar.key;

        // Label: priority + client · initials · desc
        const priorityTag = bar.priorityId ? `#${bar.priorityId} ` : '';
        // Get desc from first card that has one
        const barDesc = bar.cardIds.map(id => cards.find(c => c.id === id)).filter(Boolean).map(c => c.desc).find(d => d) || '';
        const label = document.createElement("span");
        label.className = "month-job-bar-name";
        label.style.cssText = `color:${colors.text};font-size:11px;font-weight:600;`
          + `white-space:nowrap;overflow:hidden;text-overflow:ellipsis;`
          + `padding:0 6px;width:100%;display:block;line-height:${barH}px;`;
        const descPart = barDesc ? ` — ${barDesc}` : '';
        label.textContent = `${priorityTag}${bar.client}${bar.emps ? ' · ' + bar.emps : ''}${descPart}`;
        el.appendChild(label);

        // Unified click + drag — no preventDefault so text selection isn't blocked
        el.addEventListener("mousedown", e => {
          if (e.button !== 0) return;

          const startX = e.clientX;
          const startY = e.clientY;
          const origDates = bar.cardIds.map(id => {
            const c = cards.find(x => x.id === id);
            return c ? { id, start: c.startDate, end: c.endDate } : null;
          }).filter(Boolean);

          let hasMoved = false;
          let lastHighlighted = null;

          function getCellAt(mx, my) {
            el.style.display = "none";
            const hit = document.elementFromPoint(mx, my);
            el.style.display = "";
            if (!hit) return null;
            let node = hit;
            while (node && node !== document.body) {
              if (node.classList && node.classList.contains("month-day-cell")) return node;
              node = node.parentElement;
            }
            return null;
          }

          // Capture grab cell at mousedown for grab-point-relative shifting
          const grabCell = getCellAt(e.clientX, e.clientY);
          const grabWeekRow  = grabCell ? grabCell.closest(".month-week-row") : null;
          const grabWeekIdx  = grabWeekRow ? Array.from(document.querySelectorAll(".month-week-row")).indexOf(grabWeekRow) : -1;
          const grabColIdx   = grabCell && grabWeekRow ? Array.from(grabWeekRow.querySelectorAll(".month-day-cell")).indexOf(grabCell) : -1;
          const { year: gy, month: gm } = monthAnchor;
          const grabStartMon = getMondayOf(new Date(gy, gm, 1));
          const grabDate = (grabWeekIdx >= 0 && grabColIdx >= 0)
            ? dateKey(addDays(grabStartMon, grabWeekIdx * 7 + grabColIdx))
            : bar.startDate;

          function clearHighlight() {
            if (lastHighlighted) { lastHighlighted.style.background = ""; lastHighlighted = null; }
          }

          function onMove(me) {
            const dx = me.clientX - startX;
            const dy = me.clientY - startY;
            if (!hasMoved && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
              hasMoved = true;
              el.style.opacity = "0.75";
              el.style.cursor  = "grabbing";
              el.style.zIndex  = "50";
              el.style.pointerEvents = "none";
            }
            if (hasMoved) {
              el.style.transform = `translate(${dx}px,${dy}px)`;
              clearHighlight();
              const cell = getCellAt(me.clientX, me.clientY);
              if (cell) { cell.style.background = "var(--fab-bg)"; lastHighlighted = cell; }
            }
          }

          function onUp(me) {
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup",   onUp);
            clearHighlight();
            el.style.opacity       = "1";
            el.style.cursor        = "grab";
            el.style.transform     = "";
            el.style.zIndex        = "5";
            el.style.pointerEvents = "auto";

            if (!hasMoved) {
              // Pure click — select the bar
              document.querySelectorAll(".scard.selected").forEach(s => s.classList.remove("selected"));
              selectedCardId = null;
              document.querySelectorAll(".job-bar.selected, .month-job-bar.selected").forEach(b => b.classList.remove("selected"));
              el.classList.add("selected");
              copiedCard = null; copiedJobBar = null;
              document.getElementById("board-outer").classList.remove("paste-ready");
              document.getElementById("month-outer").classList.remove("paste-ready-month");
              const empArr = bar.emps ? bar.emps.split(' ').filter(Boolean) : [];
              selectedJobBar = { client: bar.client, type: bar.type, emps: empArr, cardIds: [...bar.cardIds], startDate: bar.startDate, endDate: bar.endDate, desc: '', priorityId: bar.priorityId };
              toast(`"${bar.client}" selected — Ctrl+C to copy, Ctrl+E to edit.`);
              return;
            }

            // Drag — find drop target
            const dropCell = getCellAt(me.clientX, me.clientY);
            if (!dropCell) { renderMonth(); return; }

            const weekRowEl = dropCell.closest(".month-week-row");
            if (!weekRowEl) { renderMonth(); return; }

            const cells = Array.from(weekRowEl.querySelectorAll(".month-day-cell"));
            const colIdx = cells.indexOf(dropCell);
            const allWeekRows = Array.from(document.querySelectorAll(".month-week-row"));
            const weekIdx = allWeekRows.indexOf(weekRowEl);
            if (weekIdx < 0 || colIdx < 0) { renderMonth(); return; }

            const { year, month } = monthAnchor;
            const startMon = getMondayOf(new Date(year, month, 1));
            const dropDate = addDays(startMon, weekIdx * 7 + colIdx);

            // Grab-point-relative shift: drop position minus grab position
            const dayShift = Math.round((fromKey(dateKey(dropDate)) - fromKey(grabDate)) / 86400000);

            if (dayShift === 0) { renderMonth(); return; }

            origDates.forEach(({ id, start, end }) => {
              const card = cards.find(c => c.id === id);
              if (!card) return;
              card.startDate = dateKey(addDays(fromKey(start), dayShift));
              card.endDate   = dateKey(addDays(fromKey(end),   dayShift));
            });
            saveState();
            renderMonth();
            toast(`${bar.client} ${dayShift > 0 ? '+' : ''}${dayShift}d`);
          }

          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup",   onUp);
        });

        weekRow.appendChild(el);
      });
    });
  });

  outer.appendChild(grid);
}

// Mini picker when a bar has multiple cards

  const colors = getBarColors(bar.type);

  const existing = document.getElementById('month-bar-picker');

  const picker = document.createElement("div");

  picker.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);"
    + "background:var(--bg-primary);border:0.5px solid var(--border-mid);border-radius:var(--radius-lg);"
    + "box-shadow:0 4px 24px rgba(0,0,0,0.15);z-index:250;width:380px;overflow:hidden;";

  header.style.cssText = "padding:14px 16px;border-bottom:0.5px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;";
  header.innerHTML = `<span style="font-size:13px;font-weight:500;">${bar.client} — ${bar.type}</span>`;
  const closeBtn = document.createElement("button");
  closeBtn.innerHTML = "×";
  closeBtn.style.cssText = "background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-tertiary);line-height:1;padding:0;";

  barCards.forEach(c => {

    row.style.cssText = "display:flex;align-items:center;justify-content:space-between;padding:10px 14px;"
      + "border-bottom:0.5px solid var(--border-light);cursor:pointer;transition:background 0.1s;";
    row.addEventListener("mouseenter", () => row.style.background = "var(--bg-secondary)");
    row.addEventListener("mouseleave", () => row.style.background = "");

    const info = document.createElement("div");
    info.style.cssText = "display:flex;flex-direction:column;gap:2px;";
    info.innerHTML = `<span style="font-size:13px;font-weight:500;">${c.emp}</span>`
      + `<span style="font-size:11px;font-family:monospace;color:var(--text-tertiary);">${c.startDate} → ${c.endDate}</span>`;

    const badge = document.createElement("span");
    badge.style.cssText = `font-size:11px;font-family:monospace;color:${colors.text};background:${colors.bg};`
      + `padding:2px 8px;border-radius:3px;border:0.5px solid ${colors.border};flex-shrink:0;`;
    badge.textContent = normalizeType(c.type);

    row.appendChild(info);
    row.appendChild(badge);

    // Click → teleport to week containing this card, then open edit
    row.addEventListener("click", () => {
      picker.remove();
      // Navigate to the week containing this card's start date
      anchorMonday = getMondayOf(fromKey(c.startDate));
      setView("2week");
      // Open edit modal after render settles
      setTimeout(() => openEditModal(c.id), 80);
    });

    picker.appendChild(row);
  });

  // Add another card button
  const addBtn = document.createElement("div");
  addBtn.style.cssText = "padding:10px 12px;";
  const btn = document.createElement("button");
  btn.style.cssText = "font-size:12px;font-family:inherit;background:var(--bg-secondary);border:0.5px solid var(--border-mid);"
    + "border-radius:var(--radius-sm);padding:6px 14px;cursor:pointer;width:100%;";
  btn.textContent = `+ Add another card for ${bar.client}`;
  btn.addEventListener("click", () => {
    const firstCard = barCards[0];
    picker.remove();
    openAddModal(getEmployees()[0], firstCard ? firstCard.startDate : dateKey(new Date()));

    setTimeout(() => { document.getElementById("modal-client").value = bar.client; }, 30);
  });
  addBtn.appendChild(btn);
  picker.appendChild(addBtn);

  document.body.appendChild(picker);

  // Close on outside click
  setTimeout(() => {
    document.addEventListener("click", function close(e) {
      if (!picker.contains(e.target)) { picker.remove(); document.removeEventListener("click", close); }
    });
  }, 50);
}

// ── RENDER BOARD ──
function getWeekDates(monday) { return Array.from({length:5}, (_,i) => addDays(monday, i)); }
function cardsForEmpWeek(emp, weekDates) {
  const weekStart = dateKey(weekDates[0]);
  const weekEnd   = dateKey(weekDates[4]);
  return cards.filter(c => c.emp === emp && c.startDate <= weekEnd && c.endDate >= weekStart);
}

function renderBoard() {
  const outer = document.getElementById("board-outer");
  outer.innerHTML = "";
  const w1Mon = anchorMonday;
  const w2Mon = addDays(anchorMonday, 7);
  document.getElementById("nav-label").textContent = fmt(w1Mon) + " – " + fmt(addDays(w2Mon, 4));

  [{label:"Week 1", dates: getWeekDates(w1Mon)},
   {label:"Week 2", dates: getWeekDates(w2Mon)}
  ].forEach(({label, dates}) => {
    const weekBlock = document.createElement("div");
    weekBlock.className = "week-block";
    const wLabel = document.createElement("div");
    wLabel.className = "week-label";
    wLabel.textContent = label;
    weekBlock.appendChild(wLabel);

    const grid = document.createElement("div");
    grid.className = "grid-wrap";
    const corner = document.createElement("div");
    corner.className = "row-label-header";
    grid.appendChild(corner);
    dates.forEach((d, i) => {
      const dh = document.createElement("div");
      dh.className = "day-header" + (isToday(d) ? " is-today" : "");
      dh.innerHTML = `<div class="day-name">${DAYS[i]}</div><div class="day-date">${fmt(d)}</div>`;
      grid.appendChild(dh);
    });

    const employees = getEmployees();
    employees.forEach((emp, empIdx) => {
      const isLast    = empIdx === employees.length - 1;
      const isFloater = empIdx >= FIXED_EMPLOYEES.length;
      const floaterIdx = isFloater ? empIdx - FIXED_EMPLOYEES.length : -1;

      const rowLabel = document.createElement("div");
      rowLabel.className = "row-label" + (isLast ? " emp-row-last-label" : "");
      if (isFloater) {
        rowLabel.style.cursor = "pointer";
        rowLabel.title = "Click to rename";
        rowLabel.addEventListener("click", () => startInlineEdit(rowLabel, floaterIdx));
      }
      rowLabel.textContent = emp;
      grid.appendChild(rowLabel);

      const cells = [];
      const colStackTop = [0,0,0,0,0];

      dates.forEach((date, di) => {
        const dk = dateKey(date);
        const cell = document.createElement("div");
        cell.className = "day-cell" + (isLast ? " emp-row-last" : "") + (isToday(date) ? " is-today" : "");
        cell.dataset.emp = emp;
        cell.dataset.day = dk;
        cell.addEventListener("click", e => { if (e.target.closest(".scard")) return; if (copiedCard) return; openAddModal(emp, dk); });
        cells.push({el: cell, dk});
        grid.appendChild(cell);
      });

      const empCards = cardsForEmpWeek(emp, dates);
      empCards.forEach(card => {
        const weekStart = dateKey(dates[0]);
        const weekEnd   = dateKey(dates[4]);
        const visStart  = card.startDate < weekStart ? weekStart : card.startDate;
        const visEnd    = card.endDate   > weekEnd   ? weekEnd   : card.endDate;
        let startCol = cells.findIndex(c => c.dk === visStart);
        let endCol   = cells.findIndex(c => c.dk === visEnd);
        if (startCol < 0) startCol = 0;
        if (endCol   < 0) endCol   = 4;
        const startCell = cells[startCol];
        if (!startCell) return;
        const el = buildScardEl(card, startCol, endCol);
        el.style.left = "4px";
        el.style.top  = (4 + colStackTop[startCol]) + "px";
        el.style.right = "";
        startCell.el.appendChild(el);
        requestAnimationFrame(() => {
          let totalWidth = 0;
          for (let c = startCol; c <= endCol; c++) totalWidth += cells[c].el.getBoundingClientRect().width;
          el.style.width = (totalWidth - 8) + "px";
        });
        const cardH = 44;
        for (let c = startCol; c <= endCol; c++) colStackTop[c] += cardH + 3;
        const maxStack = Math.max(...colStackTop.slice(startCol, endCol+1));
        for (let c = startCol; c <= endCol; c++) {
          const cellEl = cells[c].el;
          const currentMin = parseInt(cellEl.style.minHeight) || 80;
          if (maxStack + 8 > currentMin) cellEl.style.minHeight = (maxStack + 8) + "px";
        }
      });
    });

    weekBlock.appendChild(grid);
    outer.appendChild(weekBlock);
    renderJobStrip(weekBlock, dates);
  });

  setTimeout(() => {
    document.querySelectorAll(".scard[data-startcol][data-endcol]").forEach(el => {
      const startCol = parseInt(el.dataset.startcol);
      const endCol   = parseInt(el.dataset.endcol);
      const grid     = el.closest(".grid-wrap");
      if (!grid) return;
      const allCells = grid.querySelectorAll(".day-cell");
      const startCell = el.parentElement;
      const startIdx  = Array.from(allCells).indexOf(startCell);
      if (startIdx < 0) return;
      const rowStart = Math.floor(startIdx / 5) * 5;
      let totalWidth = 0;
      for (let c = startCol; c <= endCol; c++) {
        const cellEl = allCells[rowStart + c];
        if (cellEl) totalWidth += cellEl.getBoundingClientRect().width;
      }
      el.style.width = (totalWidth - 8) + "px";
    });
  }, 50);
}

function buildScardEl(card, startCol, endCol) {
  // Normalize legacy types for CSS class
  const displayType = normalizeType(card.type);
  const el = document.createElement("div");
  el.className = "scard scard-" + displayType;
  el.draggable = false;
  el.dataset.id = card.id;
  el.dataset.startcol = startCol;
  el.dataset.endcol   = endCol;

  const dur = daysBetween(card.startDate, card.endDate);
  const spanLabel = dur > 0 ? `${dur+1}d` : "";
  const priorityTag = card.priorityId ? `#${card.priorityId} ` : "";

  if (card.type === "off") {
    el.innerHTML = `<span class="scard-name">Off</span>${spanLabel ? `<span class="scard-span">${spanLabel}</span>` : ""}<div class="scard-btns"><button class="scard-btn edit-btn" title="Edit">&#9998;</button><button class="scard-btn del-btn" title="Remove">&#x2715;</button></div>`;
  } else {
    el.innerHTML = `<span class="scard-name">${priorityTag}${card.client || ""}</span>${card.desc ? `<span class="scard-desc">${card.desc}</span>` : ""}${spanLabel ? `<span class="scard-span">${spanLabel}</span>` : ""}<div class="scard-btns"><button class="scard-btn edit-btn" title="Edit">&#9998;</button><button class="scard-btn del-btn" title="Remove">&#x2715;</button></div>`;
  }

  el.querySelector(".edit-btn").addEventListener("click", e => { e.stopPropagation(); openEditModal(card.id); });
  el.querySelector(".del-btn").addEventListener("click",  e => { e.stopPropagation(); openDeleteModal(card.id); });

  el.addEventListener("click", e => {
    e.stopPropagation();
    if (e.target.closest(".scard-btn")) return;
    if (el._wasDragged) { el._wasDragged = false; return; }
    // Single click = select (enables Cmd/Ctrl+C to copy)
    document.querySelectorAll(".scard.selected").forEach(s => s.classList.remove("selected"));
    el.classList.add("selected");
    selectedCardId = card.id;
    copiedCard = null;
    document.getElementById("board-outer").classList.remove("paste-ready");
  });
  el.addEventListener("dblclick", e => { e.stopPropagation(); openEditModal(card.id); });

  // Mouse drag for week view
  el.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    if (e.target.closest(".scard-btn")) return;
    e.preventDefault();
    e.stopPropagation();

    const startX = e.clientX;
    const startY = e.clientY;
    let hasMoved = false;
    let lastHighlighted = null;

    // Capture the grab cell at mousedown for grab-point-relative shifting
    el.style.display = "none";
    const grabCell = (() => {
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      if (!hit) return null;
      let node = hit;
      while (node && node !== document.body) {
        if (node.classList && node.classList.contains("day-cell")) return node;
        node = node.parentElement;
      }
      return null;
    })();
    el.style.display = "";
    const grabDate = grabCell ? grabCell.dataset.day : card.startDate;

    el.style.opacity = "0.7";
    el.style.cursor  = "grabbing";
    el.style.zIndex  = "50";
    el.style.pointerEvents = "none";

    function clearHL() { if (lastHighlighted) { lastHighlighted.classList.remove("drag-over"); lastHighlighted = null; } }

    function getWeekCell(mx, my) {
      el.style.display = "none";
      const hit = document.elementFromPoint(mx, my);
      el.style.display = "";
      if (!hit) return null;
      let node = hit;
      while (node && node !== document.body) {
        if (node.classList && node.classList.contains("day-cell")) return node;
        node = node.parentElement;
      }
      return null;
    }

    function onMove(me) {
      const dx = me.clientX - startX;
      const dy = me.clientY - startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) hasMoved = true;
      el.style.transform = `translate(${dx}px,${dy}px)`;
      clearHL();
      const cell = getWeekCell(me.clientX, me.clientY);
      if (cell) { cell.classList.add("drag-over"); lastHighlighted = cell; }
    }

    function onUp(me) {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      clearHL();
      el.style.opacity = "1";
      el.style.cursor  = "grab";
      el.style.transform = "";
      el.style.zIndex  = "10";
      el.style.pointerEvents = "auto";

      if (!hasMoved) return;

      const dropCell = getWeekCell(me.clientX, me.clientY);
      if (!dropCell) { renderBoard(); return; }

      const dropDate = dropCell.dataset.day;
      const emp      = dropCell.dataset.emp;
      if (!dropDate || !emp) { renderBoard(); return; }

      // Shift = drop position minus grab position (grab-point-relative)
      const shift = Math.round((fromKey(dropDate) - fromKey(grabDate)) / 86400000);
      if (shift === 0 && emp === card.emp) { renderBoard(); return; }

      el._wasDragged = true;
      const dur = daysBetween(card.startDate, card.endDate);
      card.emp = emp;
      card.startDate = dateKey(addDays(fromKey(card.startDate), shift));
      card.endDate   = dateKey(addDays(fromKey(card.endDate),   shift));
      saveState();
      renderBoard();
    }

    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
  return el;
}
