// ── CLIENT DATALIST ──
function populateClientDatalist() {
  const dl = document.getElementById("client-list");
  dl.innerHTML = "";
  prodClients.forEach(name => { const opt = document.createElement("option"); opt.value = name; dl.appendChild(opt); });
}

function populateEmpSelector(selectedEmp) {
  const sel = document.getElementById("modal-emp");
  sel.innerHTML = getEmployees().map(e =>
    `<option value="${e}"${e === selectedEmp ? " selected" : ""}>${e}</option>`
  ).join("");
}

// ── ADD MODAL ──
function openAddModal(emp, dayKey) {
  editId = null; addContext = {emp, dayKey};
  const modalEl = document.getElementById("modal-card");
  modalEl.dataset.editId = "";
  document.getElementById("modal-card-title").textContent = `Add assignment`;
  document.getElementById("modal-client").value   = "";
  document.getElementById("modal-desc").value     = "";
  document.getElementById("modal-priority").value = "";
  setType("fab");
  document.getElementById("modal-start").value = dayKey;
  document.getElementById("modal-end").value   = dayKey;
  populateEmpSelector(emp);
  populateClientDatalist();
  document.getElementById("modal-card").classList.add("open");
  setTimeout(() => document.getElementById("modal-emp").focus(), 60);
}

// ── EDIT MODAL ──
function openEditModal(id) {
  const card = cards.find(c => c.id === id);
  if (!card) return;
  editId = id; addContext = null;
  const modalEl = document.getElementById("modal-card");
  modalEl.dataset.editId = id;
  document.getElementById("modal-card-title").textContent = `Edit assignment`;
  setType(normalizeType(card.type));
  if (card.client && !prodClients.includes(card.client)) {
    prodClients.push(card.client); prodClients.sort();
  }
  document.getElementById("modal-client").value   = card.client   || "";
  document.getElementById("modal-desc").value     = card.desc     || "";
  document.getElementById("modal-priority").value = card.priorityId || "";
  document.getElementById("modal-start").value    = card.startDate;
  document.getElementById("modal-end").value      = card.endDate;
  populateEmpSelector(card.emp);
  populateClientDatalist();
  modalEl.classList.add("open");
}

document.getElementById("modal-card-cancel").addEventListener("click", () => { 
  document.getElementById("modal-card").dataset.editId = "";
  document.getElementById("modal-card").classList.remove("open"); 
});
document.getElementById("modal-card").addEventListener("click", e => { if (e.target === document.getElementById("modal-card")) document.getElementById("modal-card").classList.remove("open"); });
// Esc closes modal from anywhere inside it; Enter saves from anywhere except textareas
document.getElementById("modal-card").addEventListener("keydown", e => {
  if (e.key === "Escape") { e.stopPropagation(); document.getElementById("modal-card").classList.remove("open"); }
  if (e.key === "Enter" && e.target.tagName !== "TEXTAREA" && e.target.tagName !== "SELECT") { e.preventDefault(); document.getElementById("modal-card-save").click(); }
});
document.getElementById("modal-start").addEventListener("change", () => { const s = document.getElementById("modal-start").value; const e = document.getElementById("modal-end").value; if (e < s) document.getElementById("modal-end").value = s; });
document.getElementById("modal-end").addEventListener("change", () => { const s = document.getElementById("modal-start").value; const e = document.getElementById("modal-end").value; if (e < s) document.getElementById("modal-end").value = s; });

// Auto-fill duration from PM project
document.getElementById("modal-priority").addEventListener("change", async () => {
  const pNum = parseInt(document.getElementById("modal-priority").value);
  if (!pNum) return;
  const startDate = document.getElementById("modal-start").value;
  if (!startDate) return;
  const type = activeType;
  if (type === "off" || type === "walk") return;
  toast("Looking up PM project…");
  const pm = await lookupPMProject(pNum);
  if (!pm) { toast("No PM project found for priority #" + pNum); return; }
  if (pm.clientLastName && !document.getElementById("modal-client").value) {
    document.getElementById("modal-client").value = pm.clientLastName;
  }
  const budget = pm.hoursBudget || [];
  let hours = 0;
  if (type === "fab") {
    const fabHours = budget.filter(r => (r.type==='fab')||(!r.type&&r.scope&&r.scope.toLowerCase().startsWith('fab'))).reduce((s,r)=>s+(r.total||0),0);
    hours = fabHours * 0.5;
  } else if (type === "resto") {
    hours = budget.filter(r => (r.type==='resto')||(!r.type&&r.scope&&r.scope.toLowerCase().startsWith('resto'))).reduce((s,r)=>s+(r.total||0),0);
  }
  if (hours > 0) {
    const days = Math.ceil(hours / 8);
    const endDate = addBusinessDays(startDate, days - 1);
    document.getElementById("modal-end").value = endDate;
    toast(`Duration auto-set: ${days} day${days!==1?'s':''} (${hours} hrs)`);
  }
});

document.getElementById("modal-card-save").addEventListener("click", () => {
  const emp        = document.getElementById("modal-emp").value;
  const type       = activeType;
  const client     = document.getElementById("modal-client").value.trim();
  const desc       = document.getElementById("modal-desc").value.trim();
  const priorityId = parseInt(document.getElementById("modal-priority").value) || null;
  const startDate  = document.getElementById("modal-start").value;
  let   endDate    = document.getElementById("modal-end").value;
  if (!startDate) return;
  if (!endDate || endDate < startDate) endDate = startDate;
  if (type !== "off" && !client) { document.getElementById("modal-client").focus(); return; }
  if (client && !prodClients.includes(client)) { prodClients.push(client); prodClients.sort(); }

  const modalEl = document.getElementById("modal-card");
  const storedEditId = modalEl.dataset.editId || "";

  console.log("SAVE — storedEditId:", storedEditId, "| editId var:", editId, "| client:", client, "| emp:", emp);

  if (storedEditId) {
    const card = cards.find(c => c.id === storedEditId);
    console.log("EDIT — found card:", card ? card.id : "NOT FOUND");
    if (card) {
      Object.assign(card, {emp, type, client: type==="off"?"":client, desc: type==="off"?"":desc, startDate, endDate, priorityId});
      toast("Assignment updated.");
    }
  } else {
    cards.push({ id: uid(), emp, type, client: type==="off"?"":client, desc: type==="off"?"":desc, startDate, endDate, priorityId });
    toast("Assignment added.");
  }
  modalEl.dataset.editId = "";
  saveState();
  if (currentView === "2week") renderBoard(); else renderMonth();
  document.getElementById("modal-card").classList.remove("open");
});

document.getElementById("modal-client").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("modal-desc").focus(); if (e.key === "Escape") document.getElementById("modal-card-cancel").click(); });
document.getElementById("modal-desc").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("modal-card-save").click(); if (e.key === "Escape") document.getElementById("modal-card-cancel").click(); });

// ── DELETE ──
let deleteId = null;
function openDeleteModal(id) {
  deleteId = id;
  const card = cards.find(c => c.id === id);
  const label = card.type === "off" ? "Off" : (card.client || "this assignment");
  document.getElementById("modal-delete-msg").textContent = `Remove "${label}" for ${card.emp}? This can't be undone.`;
  document.getElementById("modal-delete").classList.add("open");
}
document.getElementById("modal-delete-cancel").addEventListener("click", () => { document.getElementById("modal-delete").classList.remove("open"); deleteId = null; });
document.getElementById("modal-delete-confirm").addEventListener("click", () => {
  if (deleteId) { cards = cards.filter(c => c.id !== deleteId); saveState(); if (currentView==="2week") renderBoard(); else renderMonth(); toast("Assignment removed."); }
  document.getElementById("modal-delete").classList.remove("open"); deleteId = null;
});
document.getElementById("modal-delete").addEventListener("click", e => { if (e.target === document.getElementById("modal-delete")) { document.getElementById("modal-delete").classList.remove("open"); deleteId = null; } });

// ── JOB STRIP TOGGLE ──
document.getElementById("btn-toggle-jobs").addEventListener("click", () => {
  showJobStrip = !showJobStrip;
  document.getElementById("btn-toggle-jobs").textContent = showJobStrip ? "Hide jobs" : "Show jobs";
  renderBoard();
});

// ── CLIENT MANAGER ──
function renderClientManager() {
  const wrap = document.getElementById("client-list-wrap");
  wrap.innerHTML = "";
  if (prodClients.length === 0) { wrap.innerHTML = `<div class="client-empty">No clients yet.</div>`; return; }
  prodClients.slice().sort().forEach(name => {
    const row = document.createElement("div");
    row.className = "client-list-item";
    row.innerHTML = `<span>${name}</span>`;
    const btn = document.createElement("button");
    btn.className = "client-del-btn"; btn.innerHTML = "&#x2715;"; btn.title = "Remove";
    btn.addEventListener("click", () => { prodClients = prodClients.filter(n => n !== name); saveState(); renderClientManager(); populateClientDatalist(); toast(`"${name}" removed.`); });
    row.appendChild(btn);
    wrap.appendChild(row);
  });
}
document.getElementById("btn-manage-clients").addEventListener("click", () => { renderClientManager(); document.getElementById("modal-clients").classList.add("open"); });
document.getElementById("modal-clients-close").addEventListener("click", () => { document.getElementById("modal-clients").classList.remove("open"); });
document.getElementById("modal-clients").addEventListener("click", e => { if (e.target === document.getElementById("modal-clients")) document.getElementById("modal-clients").classList.remove("open"); });
document.getElementById("btn-add-client").addEventListener("click", () => {
  const input = document.getElementById("new-client-input");
  const name = input.value.trim();
  if (!name || prodClients.includes(name)) return;
  prodClients.push(name); prodClients.sort();
  saveState(); renderClientManager(); populateClientDatalist();
  input.value = ""; toast(`"${name}" added.`);
});

// ── NAV ──
document.getElementById("btn-prev").addEventListener("click", () => {
  if (currentView === "2week") { anchorMonday = addDays(anchorMonday, -7); saveState(); renderBoard(); renderMiniCal(); }
  else { monthAnchor.month--; if (monthAnchor.month < 0) { monthAnchor.month = 11; monthAnchor.year--; } renderMonth(); }
});
document.getElementById("btn-next").addEventListener("click", () => {
  if (currentView === "2week") { anchorMonday = addDays(anchorMonday, 7); saveState(); renderBoard(); renderMiniCal(); }
  else { monthAnchor.month++; if (monthAnchor.month > 11) { monthAnchor.month = 0; monthAnchor.year++; } renderMonth(); }
});
document.getElementById("btn-today").addEventListener("click", () => { anchorMonday = getMondayOf(new Date()); saveState(); renderBoard(); renderMiniCal(); });
document.getElementById("btn-month-today").addEventListener("click", () => { const n = new Date(); monthAnchor = { year: n.getFullYear(), month: n.getMonth() }; renderMonth(); });

// ── JSON SAVE/RESTORE ──
document.getElementById("btn-save-json").addEventListener("click", async () => {
  try {
    const snap = await getDoc(DOC_REF);
    const s = snap.exists() ? snap.data() : {cards, prodClients, anchorMonday: dateKey(anchorMonday)};
    const blob = new Blob([JSON.stringify(s, null, 2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "schedule_" + new Date().toISOString().slice(0,10) + ".json"; a.click();
    toast("Schedule saved.");
  } catch(e) { toast("Could not download — check connection."); }
});
document.getElementById("btn-load-json").addEventListener("click", () => { document.getElementById("file-json").click(); });
document.getElementById("file-json").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const s = JSON.parse(ev.target.result);
      cards = s.cards || []; prodClients = s.prodClients || [];
      floaterNames = s.floaterNames || [...FLOATER_DEFAULTS];
      if (s.anchorMonday) anchorMonday = fromKey(s.anchorMonday);
      await setDoc(DOC_REF, { cards, prodClients, floaterNames, anchorMonday: dateKey(anchorMonday) });
      if (currentView==="2week") renderBoard(); else renderMonth();
      toast("Schedule restored.");
    } catch(err) { alert("Could not read that file."); }
    e.target.value = "";
  };
  reader.readAsText(file);
});

// ── FLOATER INLINE EDIT ──
function startInlineEdit(labelEl, floaterIdx) {
  const currentName = floaterNames[floaterIdx];
  const input = document.createElement("input");
  input.type = "text"; input.value = currentName;
  input.style.cssText = "width:100%;font:inherit;font-size:12px;font-weight:600;color:inherit;background:transparent;border:none;border-bottom:1.5px solid var(--border-strong);outline:none;padding:0;";
  labelEl.textContent = ""; labelEl.appendChild(input);
  input.focus(); input.select();
  function commit() {
    const newName = input.value.trim() || currentName;
    const oldName = floaterNames[floaterIdx];
    cards.forEach(c => { if (c.emp === oldName) c.emp = newName; });
    floaterNames[floaterIdx] = newName;
    saveState(); renderBoard(); toast(`Row renamed to "${newName}".`);
  }
  input.addEventListener("blur", commit);
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); input.blur(); } if (e.key === "Escape") { input.value = currentName; input.blur(); } });
}

// ── COPY/PASTE ──
document.addEventListener("keydown", e => {
  // Don't fire nav keys when typing in an input
  const tag = document.activeElement && document.activeElement.tagName;
  const inInput = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";

  if ((e.ctrlKey || e.metaKey) && e.key === "c") {
    if (selectedJobBar) {
      copiedJobBar = { ...selectedJobBar };
      copiedCard = null;
      document.getElementById("board-outer").classList.add("paste-ready");
      document.getElementById("month-outer").classList.add("paste-ready-month");
      toast(`"${selectedJobBar.client}" copied — click a cell to paste.`);
      return;
    }
    if (!selectedCardId) return;
    const card = cards.find(c => c.id === selectedCardId);
    if (!card) return;
    copiedCard = {...card};
    copiedJobBar = null;
    document.getElementById("board-outer").classList.add("paste-ready");
    toast("Card copied — click a cell to paste.");
    return;
  }

  if ((e.ctrlKey || e.metaKey) && e.key === "e") {
    if (!selectedJobBar) return;
    if (selectedJobBar.cardIds.length === 1) {
      openEditModal(selectedJobBar.cardIds[0]);
    } else if (selectedJobBar.cardIds.length > 1) {
      const barObj = cards.filter(c => selectedJobBar.cardIds.includes(c.id)).reduce((b, c) => {
        b.cardIds.push(c.id);
        if (c.startDate < b.startDate) b.startDate = c.startDate;
        if (c.endDate   > b.endDate)   b.endDate   = c.endDate;
        return b;
      }, { client: selectedJobBar.client, type: selectedJobBar.type, emps: selectedJobBar.emps.join(' '), cardIds: [], startDate: selectedJobBar.startDate, endDate: selectedJobBar.endDate, priorityId: selectedJobBar.priorityId, key: selectedJobBar.client + '||' + selectedJobBar.type });
      openMonthBarPicker(barObj);
    }
    return;
  }

  if (e.key === "Escape") {
    // Close modal first if open
    const modal = document.getElementById("modal-card");
    if (modal && modal.classList.contains("open")) {
      modal.classList.remove("open");
      return;
    }
    const deleteModal = document.getElementById("modal-delete");
    if (deleteModal && deleteModal.classList.contains("open")) {
      deleteModal.classList.remove("open");
      return;
    }
    const picker = document.getElementById("month-bar-picker");
    if (picker) { picker.remove(); return; }
    selectedCardId = null; copiedCard = null;
    selectedJobBar = null; copiedJobBar = null;
    document.querySelectorAll(".scard.selected").forEach(s => s.classList.remove("selected"));
    document.querySelectorAll(".job-bar.selected, .month-job-bar.selected").forEach(b => b.classList.remove("selected"));
    document.getElementById("board-outer").classList.remove("paste-ready");
    document.getElementById("month-outer").classList.remove("paste-ready-month");
    return;
  }

  if (inInput) return;

  // V = toggle view
  if (e.key === "v" || e.key === "V") {
    e.preventDefault();
    setView(currentView === "2week" ? "month" : "2week");
    return;
  }

  // Arrow keys = navigate
  if (e.key === "ArrowLeft") {
    e.preventDefault();
    if (currentView === "2week") {
      anchorMonday = addDays(anchorMonday, -7);
      saveState(); renderBoard(); renderMiniCal();
    } else {
      monthAnchor.month--;
      if (monthAnchor.month < 0) { monthAnchor.month = 11; monthAnchor.year--; }
      renderMonth();
    }
    return;
  }
  if (e.key === "ArrowRight") {
    e.preventDefault();
    if (currentView === "2week") {
      anchorMonday = addDays(anchorMonday, 7);
      saveState(); renderBoard(); renderMiniCal();
    } else {
      monthAnchor.month++;
      if (monthAnchor.month > 11) { monthAnchor.month = 0; monthAnchor.year++; }
      renderMonth();
    }
    return;
  }
});
document.getElementById("board-outer").addEventListener("click", e => {
  const cell = e.target.closest(".day-cell");
  if (!cell) return;
  if (e.target.closest(".scard")) return;
  if (e.target.closest(".job-bar")) return;

  if (copiedJobBar) {
    const emp = cell.dataset.emp;
    const dur = daysBetween(copiedJobBar.startDate, copiedJobBar.endDate);
    const newCard = {
      id: uid(), emp, type: copiedJobBar.type, client: copiedJobBar.client,
      desc: copiedJobBar.desc || '', startDate: cell.dataset.day,
      endDate: dateKey(addDays(fromKey(cell.dataset.day), dur)),
      priorityId: copiedJobBar.priorityId || null
    };
    cards.push(newCard);
    saveState(); renderBoard();
    toast(`Pasted "${newCard.client}" for ${emp}.`);
    return;
  }

  if (!copiedCard) return;
  const newCard = { ...copiedCard, id: uid(), emp: cell.dataset.emp, startDate: cell.dataset.day, endDate: dateKey(addDays(fromKey(cell.dataset.day), daysBetween(copiedCard.startDate, copiedCard.endDate))) };
  cards.push(newCard); saveState(); renderBoard();
  document.querySelectorAll(".scard.selected").forEach(s => s.classList.remove("selected"));
  selectedCardId = null;
  toast(`Pasted "${newCard.type === "off" ? "Off" : newCard.client}" for ${newCard.emp}.`);
});

// ── MONTH PASTE ──
document.getElementById("month-outer").addEventListener("click", e => {
  if (!copiedJobBar) return;
  if (e.target.closest(".month-job-bar")) return;
  const cell = e.target.closest(".month-day-cell");
  if (!cell || !cell.dataset.day) return;
  const clickDate = cell.dataset.day;
  const dur = daysBetween(copiedJobBar.startDate, copiedJobBar.endDate);
  copiedJobBar.emps.forEach(emp => {
    cards.push({
      id: uid(), emp, type: copiedJobBar.type, client: copiedJobBar.client,
      desc: copiedJobBar.desc || '',
      startDate: clickDate,
      endDate: dateKey(addDays(fromKey(clickDate), dur)),
      priorityId: copiedJobBar.priorityId || null
    });
  });
  saveState(); renderMonth();
  toast(`Pasted "${copiedJobBar.client}" for ${copiedJobBar.emps.join(', ')}.`);
  copiedJobBar = null; selectedJobBar = null;
  document.querySelectorAll(".month-job-bar.selected").forEach(b => b.classList.remove("selected"));
  document.getElementById("month-outer").classList.remove("paste-ready-month");
});

// ── INIT ──
(async () => {
  toast("Loading schedule...");
  await loadState();
  renderBoard();
  renderMiniCal();
  toast("Schedule loaded.");
})();

window.addEventListener("resize", () => { clearTimeout(window._resizeTo); window._resizeTo = setTimeout(renderBoard, 120); });
</script>
