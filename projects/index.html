<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPS Projects</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- Header: app name, tab bar, and the buttons the current view needs -->
<div class="app-header">
  <div class="wordmark">EPS<span>/</span>Projects</div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="jobs">Jobs</button>
    <button class="tab" data-tab="board">Board</button>
    <button class="tab" data-tab="schedule">Schedule</button>
  </nav>
  <div class="header-nav" id="headerNav"></div>
</div>

<!-- Each tab renders itself into here -->
<main id="view"></main>

<!-- Save bar and toast are shared; jobs.js drives them -->
<div class="save-bar" id="saveBar">
  <div class="save-status" id="saveStatus">Unsaved changes</div>
  <button class="btn-save" id="btnSave">Save Changes</button>
</div>
<div class="toast" id="toast"></div>

<!-- Sign-in gate. Signed-in @eastportlandsash.com accounts only. -->
<div id="eps-auth-gate">
  <div class="gate-title">East Portland Sash &mdash; Tools</div>
  <div id="eps-auth-msg" class="gate-msg">Sign in with your East Portland Sash account to load your data.</div>
  <button id="eps-auth-btn" class="gate-btn">Sign in with Google</button>
</div>

<script type="module">
  import { onAuthChange, isEpsUser, signIn, signOutUser } from "./data.js";
  import { mountJobs, unmountJobs, jobsHasUnsaved } from "./jobs.js";
  // Board and Schedule load lazily so a problem in one tab never blocks the others.
  const lazy = {
    board:    () => import("./board.js").then((m) => ({ mount: m.mountBoard,    unsaved: m.boardHasUnsaved })),
    schedule: () => import("./schedule.js").then((m) => ({ mount: m.mountSchedule, unsaved: m.scheduleHasUnsaved })),
  };
  const loaded = {};

  // ── Sign-in gate ──
  const gate = document.getElementById("eps-auth-gate");
  const msg  = document.getElementById("eps-auth-msg");
  const btn  = document.getElementById("eps-auth-btn");

  onAuthChange((user) => {
    if (isEpsUser(user)) { gate.style.display = "none"; return; }
    if (user) {
      msg.textContent = `That account (${user.email}) is not an East Portland Sash account. Sign in with your @eastportlandsash.com login.`;
      signOutUser();
    }
    gate.style.display = "flex";
  });

  btn.onclick = async () => {
    try { await signIn(); }
    catch (e) { msg.textContent = "Sign-in failed: " + (e && e.message || e); }
  };

  // ── Tabs ──
  const view = document.getElementById("view");
  const tabs = document.getElementById("tabs");
  let current = null;

  async function showTab(name, opts = {}) {
    if (name === current && !opts.jobId && !opts.view) return;
    // Leaving a tab with unsaved edits deserves a warning.
    const unsaved = current === "jobs" ? jobsHasUnsaved() : (loaded[current] ? loaded[current].unsaved() : false);
    if (current && current !== name && unsaved && !confirm("You have unsaved changes. Leave anyway?")) return;
    if (current === "jobs" && name !== "jobs") unmountJobs();
    current = name;
    // Remember where you are in the URL (#schedule/forecast), so a refresh lands back here.
    const hash = "#" + name + (opts.view ? "/" + opts.view : "");
    if (location.hash !== hash && !opts.jobId) history.replaceState(null, "", hash);
    tabs.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === name));
    document.getElementById("headerNav").innerHTML = "";
    document.getElementById("saveBar").classList.remove("visible");

    if (name === "jobs") { mountJobs(view, opts); return; }
    view.innerHTML = `<div class="placeholder"><p>Loading…</p></div>`;
    try {
      loaded[name] = loaded[name] || await lazy[name]();
      loaded[name].mount(view, opts);
    } catch (e) {
      const label = name === "board" ? "Board" : "Schedule";
      view.innerHTML = `<div class="placeholder"><div class="placeholder-title">${label}</div><p>coming next</p><p style="font-size:11px;color:#a09880">${(e && e.message) || e}</p></div>`;
    }
  }

  tabs.addEventListener("click", (e) => {
    const t = e.target.closest(".tab");
    if (t) showTab(t.dataset.tab);
  });
  // Other modules ask for a tab by dispatching this event (e.g. a lead-time cell).
  document.addEventListener("eps:navigate", (e) => showTab(e.detail.tab, e.detail));

  // Open on the tab in the URL (#jobs, #board, #schedule/forecast, #schedule/crew); Jobs otherwise.
  function fromHash() {
    const [tab, sub] = location.hash.replace(/^#/, "").split("/");
    return { tab: ["jobs", "board", "schedule"].includes(tab) ? tab : "jobs", view: sub || undefined };
  }
  const start = fromHash();
  showTab(start.tab, start.view ? { view: start.view } : {});
  window.addEventListener("hashchange", () => { const h = fromHash(); showTab(h.tab, h.view ? { view: h.view } : {}); });
</script>
</body>
</html>
