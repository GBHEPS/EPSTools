<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPS Schedule Board</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #ffffff;
  --bg-secondary: #f5f4f0;
  --bg-tertiary: #eeede8;
  --text-primary: #1a1a18;
  --text-secondary: #5f5e5a;
  --text-tertiary: #8e8d87;
  --border-light: rgba(0,0,0,0.18);
  --border-mid: rgba(0,0,0,0.28);
  --border-strong: rgba(0,0,0,0.42);
  --green-bg: #EAF3DE;
  --green-border: #97C459;
  --green-text: #27500A;
  --blue-bg: #E6F1FB;
  --blue-border: #378ADD;
  --blue-text: #0C447C;
  --red-bg: #FCEBEB;
  --red-border: #E24B4A;
  --red-text: #791F1F;
  --today-bg: #fffbf0;
  --today-border: #EF9F27;
  --orange-bg: #FFF3E0;
  --orange-border: #EF9F27;
  --orange-text: #7A4A00;
  --row-label-w: 90px;
  --cell-min-h: 80px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  min-height: 100vh;
}

header {
  background: var(--bg-primary);
  border-bottom: 0.5px solid var(--border-light);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 50;
}

header h1 {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: .04em;
  text-transform: uppercase;
  white-space: nowrap;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.header-divider { width: 0.5px; height: 20px; background: var(--border-light); }

.toolbar-btn {
  font-size: 11px;
  font-family: inherit;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  border: 0.5px solid var(--border-mid);
  border-radius: var(--radius-sm);
  padding: 5px 10px;
  cursor: pointer;
  white-space: nowrap;
}
.toolbar-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.toolbar-btn.active {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border-color: var(--border-strong);
}

/* Segmented view toggle */
.view-toggle {
  display: flex;
  border: 0.5px solid var(--border-mid);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.view-toggle-btn {
  font-size: 11px;
  font-family: inherit;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  border: none;
  border-right: 0.5px solid var(--border-mid);
  padding: 5px 12px;
  cursor: pointer;
  white-space: nowrap;
}
.view-toggle-btn:last-child { border-right: none; }
.view-toggle-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.view-toggle-btn.active {
  background: var(--text-primary);
  color: var(--bg-primary);
}

.legend { display: flex; gap: 10px; align-items: center; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-secondary); }
.legend-dot { width: 9px; height: 9px; border-radius: 2px; }

.nav-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px 0;
}

.nav-week-label { font-size: 13px; font-weight: 500; color: var(--text-secondary); }

.nav-controls { display: flex; align-items: center; gap: 8px; }

.nav-btn {
  width: 28px; height: 28px;
  border: 0.5px solid var(--border-mid);
  border-radius: var(--radius-sm);
  background: var(--bg-primary);
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit;
}
.nav-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }

.nav-today-btn {
  font-size: 11px; font-family: inherit;
  color: var(--text-secondary);
  background: none;
  border: 0.5px solid var(--border-mid);
  border-radius: var(--radius-sm);
  padding: 5px 10px; cursor: pointer;
}
.nav-today-btn:hover { background: var(--bg-tertiary); }

/* ── BOARD ── */
.board-outer { padding: 10px 16px 40px; }

.week-block { margin-bottom: 14px; }

.week-label {
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-tertiary);
  padding: 6px 0 4px var(--row-label-w);
}

/* ── JOB STRIP ── */
.job-strip-wrap {
  display: grid;
  grid-template-columns: var(--row-label-w) repeat(5, 1fr);
  margin-bottom: 4px;
  position: relative;
  min-height: 28px;
}

.job-strip-label {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--text-tertiary);
  padding: 6px 6px 0 2px;
  display: flex;
  align-items: flex-start;
  white-space: nowrap;
  overflow: hidden;
}

.job-strip-cells {
  grid-column: 2 / 7;
  position: relative;
  min-height: 28px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
}

.job-strip-day-col { position: relative; }

.job-bar {
  position: absolute;
  top: 4px;
  height: 20px;
  background: var(--orange-bg);
  border: 0.5px solid var(--orange-border);
  border-radius: 3px;
  display: flex;
  align-items: center;
  padding: 0 6px;
  overflow: hidden;
  pointer-events: none;
  z-index: 2;
}

.job-bar-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--orange-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── TWO-WEEK GRID ── */
.grid-wrap {
  display: grid;
  grid-template-columns: var(--row-label-w) repeat(5, 1fr);
  border: 0.5px solid var(--border-mid);
  border-radius: var(--radius-md);
  overflow: visible;
  background: var(--bg-primary);
  position: relative;
}

.row-label-header {
  background: var(--bg-tertiary);
  border-right: 0.5px solid var(--border-mid);
  border-bottom: 1px solid var(--border-mid);
  border-radius: var(--radius-md) 0 0 0;
}

.day-header {
  background: var(--bg-tertiary);
  border-right: 0.5px solid var(--border-light);
  border-bottom: 1px solid var(--border-mid);
  padding: 6px 4px 5px;
  text-align: center;
}
.day-header:last-child { border-right: none; border-radius: 0 var(--radius-md) 0 0; }

.day-name { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-tertiary); }
.day-date { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-top: 1px; }

.day-header.is-today { background: var(--today-bg); border-bottom-color: var(--today-border); }
.day-header.is-today .day-name { color: #BA7517; }
.day-header.is-today .day-date { color: #854F0B; }

.row-label {
  background: var(--bg-secondary);
  border-right: 0.5px solid var(--border-mid);
  border-bottom: 0.5px solid var(--border-light);
  padding: 8px 8px 8px 10px;
  display: flex; align-items: flex-start;
  font-size: 12px; font-weight: 600;
  color: var(--text-secondary);
  min-height: var(--cell-min-h);
  position: relative;
  z-index: 1;
}

.emp-row-last .row-label { border-bottom: none; border-radius: 0 0 0 var(--radius-md); }
.emp-row-last .day-cell { border-bottom: none; }
.emp-row-last .day-cell:last-child { border-radius: 0 0 var(--radius-md) 0; }

.day-cell {
  border-right: 0.5px solid var(--border-light);
  border-bottom: 0.5px solid var(--border-light);
  min-height: var(--cell-min-h);
  padding: 4px;
  position: relative;
  cursor: pointer;
}
.day-cell:last-child { border-right: none; }
.day-cell.is-today { background: var(--today-bg); }
.day-cell:hover { background: var(--bg-secondary); }
.day-cell.is-today:hover { background: #fff8e6; }
.day-cell.drag-over {
  background: var(--green-bg);
  outline: 1.5px dashed var(--green-border);
  outline-offset: -2px;
}

/* ── SPANNING CARDS ── */
.scard {
  position: absolute;
  top: 4px;
  left: 4px;
  right: 4px;
  border-radius: var(--radius-sm);
  padding: 4px 24px 4px 6px;
  font-size: 11px;
  cursor: grab;
  user-select: none;
  z-index: 10;
  min-height: 36px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  overflow: hidden;
}
.scard:active { cursor: grabbing; }
.scard.dragging { opacity: 0.3; }
.scard-shop { background: var(--green-bg); border: 0.5px solid var(--green-border); color: var(--green-text); }
.scard-site  { background: var(--blue-bg);  border: 0.5px solid var(--blue-border);  color: var(--blue-text); }
.scard-off   { background: var(--red-bg);   border: 0.5px solid var(--red-border);   color: var(--red-text); }
.scard-name  { font-weight: 600; font-size: 11px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scard-desc  { font-size: 10px; font-weight: 400; opacity: 0.85; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scard-span  { font-size: 9px; font-weight: 500; opacity: 0.65; margin-top: 1px; }

.scard-btns {
  position: absolute; top: 3px; right: 3px;
  display: flex; gap: 2px;
  opacity: 0; transition: opacity 0.1s;
}
.scard:hover .scard-btns { opacity: 1; }

.scard-btn {
  width: 16px; height: 16px;
  border-radius: 2px; border: none;
  font-size: 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit; line-height: 1;
}
.scard-shop .scard-btn { background: rgba(39,80,10,0.14); color: var(--green-text); }
.scard-site  .scard-btn { background: rgba(12,68,124,0.14); color: var(--blue-text); }
.scard-off   .scard-btn { background: rgba(121,31,31,0.14); color: var(--red-text); }
.scard-btn:hover { opacity: 0.65; }

.scard.selected { outline: 2px solid var(--text-primary); outline-offset: 1px; }
.scard-shop.selected { outline-color: #3B6D11; }
.scard-site.selected  { outline-color: #185FA5; }
.scard-off.selected   { outline-color: var(--red-border); }

.paste-ready .day-cell { cursor: copy; }
.paste-ready .day-cell:hover {
  background: #f0f7e8;
  outline: 1.5px dashed var(--green-border);
  outline-offset: -2px;
}

/* ── MONTH VIEW ── */
.month-outer { padding: 10px 16px 40px; }

.month-grid {
  background: var(--bg-primary);
  border: 0.5px solid var(--border-mid);
  border-radius: var(--radius-md);
  overflow: hidden;
}

/* 7 columns: Mon-Fri + Sat + Sun */
.month-header-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr) 60px 60px;
  border-bottom: 1px solid var(--border-mid);
  background: var(--bg-tertiary);
}

.month-col-header {
  padding: 6px 4px 5px;
  text-align: center;
  border-right: 0.5px solid var(--border-light);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--text-tertiary);
}
.month-col-header:last-child { border-right: none; }
.month-col-header.weekend { color: var(--text-tertiary); opacity: 0.5; }

.month-week-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr) 60px 60px;
  border-bottom: 0.5px solid var(--border-light);
  min-height: 80px;
  position: relative;
}
.month-week-row:last-child { border-bottom: none; }

.month-day-cell {
  border-right: 0.5px solid var(--border-light);
  padding: 4px 5px 24px;
  position: relative;
  min-height: 80px;
}
.month-day-cell:last-child { border-right: none; }

.month-day-cell.weekend {
  background: var(--bg-secondary);
  opacity: 0.6;
}
.month-day-cell.other-month .month-day-num {
  color: var(--text-tertiary);
  opacity: 0.4;
}
.month-day-cell.is-today {
  background: var(--today-bg);
}

.month-day-num {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-secondary);
  line-height: 1;
  margin-bottom: 2px;
}
.month-day-cell.is-today .month-day-num {
  color: #854F0B;
  font-weight: 700;
}

/* Month job bars: absolutely positioned within the week row,
   spanning from their start col to end col */
.month-job-bar {
  position: absolute;
  height: 22px;
  background: var(--orange-bg);
  border: 0.5px solid var(--orange-border);
  border-radius: 3px;
  display: flex;
  align-items: center;
  padding: 0 6px;
  overflow: hidden;
  pointer-events: none;
  z-index: 5;
}

.month-job-bar-inner {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  width: 100%;
}

.month-job-bar-name {
  font-size: 10px;
  font-weight: 600;
  color: var(--orange-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}

.month-job-bar-initials {
  font-size: 9px;
  font-weight: 500;
  color: var(--orange-text);
  opacity: 0.75;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ── MODALS ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.3); z-index: 200;
  align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--bg-primary);
  border: 0.5px solid var(--border-mid);
  border-radius: var(--radius-lg);
  padding: 22px; width: 320px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.12);
  max-height: 90vh; overflow-y: auto;
}
.modal h3 { font-size: 14px; font-weight: 500; margin-bottom: 14px; color: var(--text-primary); }

.modal label {
  font-size: 11px; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: .05em;
  display: block; margin-bottom: 4px; margin-top: 10px;
}
.modal label:first-of-type { margin-top: 0; }

.modal input[type="text"],
.modal input[type="date"] {
  width: 100%;
  border: 0.5px solid var(--border-mid);
  border-radius: var(--radius-sm);
  padding: 8px 10px; font-size: 13px;
  font-family: inherit; color: var(--text-primary);
  background: var(--bg-primary); outline: none;
}
.modal input:focus { border-color: var(--border-strong); }

.modal-btns {
  display: flex; gap: 8px;
  justify-content: flex-end; margin-top: 16px;
}
.modal-btns button {
  font-size: 13px; padding: 7px 16px;
  border-radius: var(--radius-sm);
  border: 0.5px solid var(--border-mid);
  background: var(--bg-primary); color: var(--text-primary);
  cursor: pointer; font-family: inherit;
}
.modal-btns button:hover { background: var(--bg-secondary); }
.btn-primary { background: var(--text-primary) !important; color: var(--bg-primary) !important; border-color: var(--text-primary) !important; }
.btn-primary:hover { opacity: 0.82 !important; background: var(--text-primary) !important; }
.btn-danger { background: #c0392b !important; color: #fff !important; border-color: #c0392b !important; }
.btn-danger:hover { opacity: 0.85 !important; }

.type-btns { display: flex; gap: 6px; }
.type-btn {
  flex: 1; padding: 7px 4px;
  border-radius: var(--radius-sm);
  border: 0.5px solid var(--border-mid);
  background: var(--bg-secondary);
  font-size: 12px; font-family: inherit;
  cursor: pointer; font-weight: 500; color: var(--text-secondary);
}
.type-btn.active-shop { background: var(--green-bg); color: var(--green-text); border-color: var(--green-border); }
.type-btn.active-site { background: var(--blue-bg); color: var(--blue-text); border-color: var(--blue-border); }
.type-btn.active-off  { background: var(--red-bg);  color: var(--red-text);  border-color: var(--red-border); }

.modal-note-text { font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; line-height: 1.5; }

.client-list-wrap {
  max-height: 260px; overflow-y: auto;
  border: 0.5px solid var(--border-light);
  border-radius: var(--radius-sm);
  margin-top: 4px;
}
.client-list-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px;
  border-bottom: 0.5px solid var(--border-light);
  font-size: 13px; color: var(--text-primary);
}
.client-list-item:last-child { border-bottom: none; }
.client-del-btn {
  width: 18px; height: 18px; border-radius: 3px;
  border: none; background: var(--bg-tertiary);
  color: var(--text-tertiary); font-size: 11px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-family: inherit; flex-shrink: 0;
}
.client-del-btn:hover { background: #fdecea; color: #c0392b; }
.client-empty { font-size: 12px; color: var(--text-tertiary); padding: 12px 10px; text-align: center; }

#toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--text-primary); color: var(--bg-primary);
  font-size: 12px; padding: 8px 18px; border-radius: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 300; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── PRINT ── */
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  header { display: none; }
  .nav-wrap { display: none; }
  #toast { display: none; }
  .modal-overlay { display: none !important; }
  body { background: white; }
  .board-outer { padding: 4px 8px 8px; }
  .month-outer { padding: 4px 8px 8px; }
  .week-block { margin-bottom: 10px; page-break-inside: avoid; }
  .job-strip-wrap { min-height: 24px; }
  .job-bar { height: 16px; top: 3px; }
  .job-bar-label { font-size: 9px; }
  :root { --row-label-w: 72px; --cell-min-h: 64px; }
  .day-header { padding: 4px 3px; }
  .day-name { font-size: 12px; }
  .day-date { font-size: 17px; margin-top: 1px; }
  .row-label { font-size: 16px; font-weight: 600; padding: 5px 5px 5px 7px; min-height: var(--cell-min-h); }
  .day-cell { min-height: var(--cell-min-h); padding: 3px; }
  .scard { padding: 3px 5px; min-height: 32px; border-radius: 3px; background: white !important; }
  .scard-shop { border: 2px solid #97C459 !important; color: #27500A !important; }
  .scard-site  { border: 2px solid #378ADD !important; color: #0C447C !important; }
  .scard-off   { border: 2px solid #E24B4A !important; color: #791F1F !important; }
  .scard-name { font-size: 16px; }
  .scard-desc { font-size: 12px; }
  .scard-span { font-size: 11px; }
  .scard-btns { display: none; }
  .month-job-bar { border: 1.5px solid #EF9F27 !important; background: white !important; }
}
</style>
</head>
<body>

<header>
  <h1>East Portland Sash &mdash; Schedule Board</h1>
  <div class="header-right">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#97C459;"></div> Shop</div>
      <div class="legend-item"><div class="legend-dot" style="background:#378ADD;"></div> Site</div>
      <div class="legend-item"><div class="legend-dot" style="background:#E24B4A;"></div> Off</div>
      <div class="legend-item"><div class="legend-dot" style="background:#EF9F27;"></div> Job</div>
    </div>
    <div class="header-divider"></div>
    <div class="view-toggle">
      <button class="view-toggle-btn active" id="btn-view-2week">2-Week</button>
      <button class="view-toggle-btn" id="btn-view-month">Month</button>
    </div>
    <div class="header-divider"></div>
    <button class="toolbar-btn" id="btn-toggle-jobs">Hide jobs</button>
    <div class="header-divider" id="divider-2week-only"></div>
    <button class="toolbar-btn" id="btn-save-json">Save schedule</button>
    <button class="toolbar-btn" id="btn-load-json">Restore schedule</button>
    <div class="header-divider"></div>
    <button class="toolbar-btn" id="btn-import-prod">Import prod board</button>
    <button class="toolbar-btn" id="btn-manage-clients">Manage clients</button>
    <input type="file" id="file-json" accept=".json" style="display:none">
    <input type="file" id="file-prod" accept=".json" style="display:none">
  </div>
</header>

<!-- Two-week nav -->
<div class="nav-wrap" id="nav-2week">
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="nav-controls" style="flex-direction:column;gap:3px;">
      <button class="nav-btn" id="btn-prev" title="Previous week">&#9650;</button>
      <button class="nav-btn" id="btn-next" title="Next week">&#9660;</button>
    </div>
    <div>
      <div class="nav-week-label" id="nav-label"></div>
      <button class="nav-today-btn" id="btn-today" style="margin-top:5px;">Jump to today</button>
    </div>
  </div>
</div>

<!-- Month nav -->
<div class="nav-wrap" id="nav-month" style="display:none;">

<script type="module">

import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBiwsuVyEormZua4fUh7rLeIAQp0BZ-y8A",

};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const DOC_REF = doc(db, "boards", "schedule");

const FIXED_EMPLOYEES = ["Adam","Sam","Addy","Aly","Maxx"];
const FLOATER_DEFAULTS = ["Floater A","Floater B"];
let floaterNames = [...FLOATER_DEFAULTS];
const DAYS = ["Mon","Tue","Wed","Thu","Fri"];
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

// Fixed initials lookup
const INITIALS_MAP = {
  "Adam": "AB",
  "Sam":  "SF",
  "Addy": "AP",
  "Aly":  "AS",
  "Maxx": "MW",
  "Geoffrey": "GH"
};

function getInitials(empName) {
  if (INITIALS_MAP[empName]) return INITIALS_MAP[empName];
  // Auto-derive from floater name: first letter of each word
  const parts = empName.trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return parts[0].slice(0,2).toUpperCase();
}

function getEmployees() {
  return [...FIXED_EMPLOYEES, ...floaterNames];
}

// ── VIEW STATE ──
let currentView = "2week"; // "2week" | "month"
let showJobStrip = true;

// Month view anchor: year + month number (0-indexed)
const now = new Date();
let monthAnchor = { year: now.getFullYear(), month: now.getMonth() };

// ── DATE UTILS ──
function getMondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

function dateKey(date) {
  const d = new Date(date);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function fromKey(key) {
  const [y,m,d] = key.split("-").map(Number);
  return new Date(y, m-1, d);
}

function fmt(date) {
  return (date.getMonth()+1) + "/" + date.getDate();
}

function isToday(date) {
  const t = new Date();
  return date.getFullYear() === t.getFullYear() &&
    date.getMonth() === t.getMonth() &&
    date.getDate() === t.getDate();
}

function daysBetween(startKey, endKey) {
  return Math.round((fromKey(endKey) - fromKey(startKey)) / 86400000);
}

// ── STATE ──
let anchorMonday = getMondayOf(new Date());
let cards = [];
let prodClients = [];
let editId = null;
let addContext = null;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

async function loadState() {
  try {
    const snap = await getDoc(DOC_REF);
    if (snap.exists()) {
      const s = snap.data();
      cards = s.cards || [];
      prodClients = s.prodClients || [];
      floaterNames = s.floaterNames || [...FLOATER_DEFAULTS];
      if (s.anchorMonday) anchorMonday = fromKey(s.anchorMonday);
    }
  } catch(e) {
    console.warn("Firestore load failed", e);
  }
}

let saveTimer = null;
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await setDoc(DOC_REF, { cards, prodClients, floaterNames, anchorMonday: dateKey(anchorMonday) });
    } catch(e) {
      console.warn("Firestore save failed", e);
      toast("Auto-save failed -- check connection.");
    }
  }, 800);
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._to);
  t._to = setTimeout(() => t.classList.remove("show"), 2400);
}

// ── VIEW SWITCHING ──
function setView(view) {
  currentView = view;

  document.getElementById("btn-view-2week").classList.toggle("active", view === "2week");
  document.getElementById("btn-view-month").classList.toggle("active", view === "month");

  document.getElementById("nav-2week").style.display   = view === "2week" ? "" : "none";
  document.getElementById("nav-month").style.display   = view === "month" ? "" : "none";
  document.getElementById("board-outer").style.display = view === "2week" ? "" : "none";
  document.getElementById("month-outer").style.display = view === "month" ? "" : "none";

  // Show/hide job strip toggle only in 2-week mode
  document.getElementById("btn-toggle-jobs").style.display    = view === "2week" ? "" : "none";
  document.getElementById("divider-2week-only").style.display = view === "2week" ? "" : "none";

  if (view === "2week") {
    renderBoard();
  } else {
    renderMonth();
  }
}

document.getElementById("btn-view-2week").addEventListener("click", () => setView("2week"));
document.getElementById("btn-view-month").addEventListener("click", () => setView("month"));

// ── JOB STRIP LOGIC ──
function getJobsForWeek(weekDates) {
  const weekStart = dateKey(weekDates[0]);
  const weekEnd   = dateKey(weekDates[4]);
  const jobMap = {};
  cards.forEach(c => {
    if (c.type === "off" || !c.client) return;
    if (c.endDate < weekStart || c.startDate > weekEnd) return;
    if (!jobMap[c.client]) {
      jobMap[c.client] = { client: c.client, startDate: c.startDate, endDate: c.endDate };
    } else {
      if (c.startDate < jobMap[c.client].startDate) jobMap[c.client].startDate = c.startDate;
      if (c.endDate   > jobMap[c.client].endDate)   jobMap[c.client].endDate   = c.endDate;
    }
  });
  return Object.values(jobMap);
}

function jobColRange(job, weekDates) {
  const weekStart = dateKey(weekDates[0]);
  const weekEnd   = dateKey(weekDates[4]);
  const clampedStart = job.startDate < weekStart ? weekStart : job.startDate;
  const clampedEnd   = job.endDate   > weekEnd   ? weekEnd   : job.endDate;
  let startCol = -1, endCol = -1;
  weekDates.forEach((d, i) => {
    const dk = dateKey(d);
    if (startCol < 0 && dk >= clampedStart) startCol = i;
    if (dk <= clampedEnd) endCol = i;
  });
  if (startCol < 0) startCol = 0;
  if (endCol   < 0) endCol   = 4;
  return { startCol, endCol };
}

function renderJobStrip(weekBlock, weekDates) {
  const existing = weekBlock.querySelector(".job-strip-wrap");
  if (existing) existing.remove();
  if (!showJobStrip) return;

  const jobs = getJobsForWeek(weekDates);
  if (jobs.length === 0) return;

  jobs.sort((a, b) => a.startDate.localeCompare(b.startDate));

  const rows = [];
  const barPlacements = jobs.map(job => {
    const { startCol, endCol } = jobColRange(job, weekDates);
    let rowIdx = rows.findIndex(rowEndCol => rowEndCol < startCol);
    if (rowIdx < 0) { rowIdx = rows.length; rows.push(endCol); }
    else { rows[rowIdx] = endCol; }
    return { job, startCol, endCol, rowIdx };
  });

  const barH = 20, barGap = 3;
  const stripH = rows.length * (barH + barGap) + 4;

  const stripWrap = document.createElement("div");
  stripWrap.className = "job-strip-wrap";
  stripWrap.style.minHeight = stripH + "px";

  const stripLabel = document.createElement("div");
  stripLabel.className = "job-strip-label";
  stripLabel.textContent = "Jobs";
  stripWrap.appendChild(stripLabel);

  const stripCells = document.createElement("div");
  stripCells.className = "job-strip-cells";
  stripCells.style.minHeight = stripH + "px";

  for (let i = 0; i < 5; i++) {
    const col = document.createElement("div");
    col.className = "job-strip-day-col";
    col.dataset.col = i;
    stripCells.appendChild(col);
  }
  stripWrap.appendChild(stripCells);

  const weekLabel = weekBlock.querySelector(".week-label");
  weekLabel.insertAdjacentElement("afterend", stripWrap);

  requestAnimationFrame(() => {
    const colEls = stripCells.querySelectorAll(".job-strip-day-col");
    barPlacements.forEach(({ job, startCol, endCol, rowIdx }) => {
      if (!colEls[startCol]) return;
      const startRect = colEls[startCol].getBoundingClientRect();
      const endRect   = colEls[endCol].getBoundingClientRect();
      const stripRect = stripCells.getBoundingClientRect();
      const left  = startRect.left - stripRect.left + 2;
      const width = endRect.right  - startRect.left - 4;
      const top   = 4 + rowIdx * (barH + barGap);
      const bar = document.createElement("div");
      bar.className = "job-bar";
      bar.style.left   = left  + "px";
      bar.style.width  = width + "px";
      bar.style.top    = top   + "px";
      bar.style.height = barH  + "px";
      const label = document.createElement("span");
      label.className = "job-bar-label";
      label.textContent = job.client;
      bar.appendChild(label);
      stripCells.appendChild(bar);
    });
    stripCells.style.minHeight = stripH + "px";
    stripWrap.style.minHeight  = stripH + "px";
  });
}

// ── MONTH VIEW ──

// Get all Mon-Sun weeks that cover the given month.
// Returns array of week arrays (7 dates each: Mon..Sun).
function getMonthWeeks(year, month) {
  const firstDay = new Date(year, month, 1);
  const lastDay  = new Date(year, month + 1, 0);
  const monday   = getMondayOf(firstDay);
  const weeks    = [];
  let cursor     = new Date(monday);

  while (cursor <= lastDay || weeks.length === 0) {
    const week = [];
    for (let i = 0; i < 7; i++) {
      week.push(new Date(cursor));
      cursor = addDays(cursor, 1);
    }
    weeks.push(week);
    if (cursor > lastDay && weeks.length >= 4) break;
  }
  return weeks;
}

// Get unique initials for all staff on a given job within a date range
function getJobInitials(clientName, rangeStart, rangeEnd) {
  const initialsSet = new Set();
  cards.forEach(c => {
    if (c.type === "off" || c.client !== clientName) return;
    // overlap check
    if (c.endDate < rangeStart || c.startDate > rangeEnd) return;
    initialsSet.add(getInitials(c.emp));
  });
  return Array.from(initialsSet).join(" ");
}

// Derive jobs active in a given month, with full date spans
function getJobsForMonth(year, month) {
  const monthStart = dateKey(new Date(year, month, 1));
  const monthEnd   = dateKey(new Date(year, month + 1, 0));
  const jobMap = {};

  cards.forEach(c => {
    if (c.type === "off" || !c.client) return;
    if (c.endDate < monthStart || c.startDate > monthEnd) return;
    if (!jobMap[c.client]) {
      jobMap[c.client] = { client: c.client, startDate: c.startDate, endDate: c.endDate };
    } else {
      if (c.startDate < jobMap[c.client].startDate) jobMap[c.client].startDate = c.startDate;
      if (c.endDate   > jobMap[c.client].endDate)   jobMap[c.client].endDate   = c.endDate;
    }
  });
  return Object.values(jobMap).sort((a,b) => a.startDate.localeCompare(b.startDate));
}

function renderMonth() {
  const outer = document.getElementById("month-outer");
  outer.innerHTML = "";

  const { year, month } = monthAnchor;
  document.getElementById("nav-month-label").textContent = MONTH_NAMES[month] + " " + year;

  const weeks = getMonthWeeks(year, month);
  const monthJobs = getJobsForMonth(year, month);
  const monthStart = dateKey(new Date(year, month, 1));
  const monthEnd   = dateKey(new Date(year, month + 1, 0));

  // Build grid
  const grid = document.createElement("div");
  grid.className = "month-grid";

  // Column headers
  const headerRow = document.createElement("div");
  headerRow.className = "month-header-row";
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach((d, i) => {
    const h = document.createElement("div");
    h.className = "month-col-header" + (i >= 5 ? " weekend" : "");
    h.textContent = d;
    headerRow.appendChild(h);
  });
  grid.appendChild(headerRow);

  // We need to lay out job bars per week row.
  // For each week, figure out which jobs are visible and their col range (0-6).
  // Col 0-4 = Mon-Fri, 5 = Sat, 6 = Sun.
  // We only use Mon-Fri (cols 0-4) for job bars since jobs are weekday-based.

  weeks.forEach(weekDays => {
    // weekDays[0] = Mon, ..., weekDays[6] = Sun
    const wkStart = dateKey(weekDays[0]); // Monday
    const wkEnd   = dateKey(weekDays[4]); // Friday (for job purposes)

    const weekRow = document.createElement("div");
    weekRow.className = "month-week-row";

    // Day cells
    weekDays.forEach((d, di) => {
      const cell = document.createElement("div");
      const dk = dateKey(d);
      const inMonth = d.getMonth() === month && d.getFullYear() === year;
      const isWknd  = di >= 5;

      cell.className = "month-day-cell" +
        (isWknd  ? " weekend"     : "") +
        (!inMonth ? " other-month" : "") +
        (isToday(d) ? " is-today"  : "");

      const num = document.createElement("div");
      num.className = "month-day-num";
      num.textContent = d.getDate();
      cell.appendChild(num);

      weekRow.appendChild(cell);
    });

    grid.appendChild(weekRow);

    // Now place job bars for this week row.
    // We do this after appending so we can measure cell positions.
    // Gather jobs that overlap Mon-Fri of this week.
    const weekJobs = monthJobs.filter(job => {
      return job.endDate >= wkStart && job.startDate <= wkEnd;
    });

    if (weekJobs.length === 0) return;

    weekJobs.sort((a,b) => a.startDate.localeCompare(b.startDate));

    // Row-pack bars (cols 0-4 only)
    const barRows = [];
    const placements = weekJobs.map(job => {
      // Clamp to Mon-Fri of this week
      const clampStart = job.startDate < wkStart ? wkStart : job.startDate;
      const clampEnd   = job.endDate   > wkEnd   ? wkEnd   : job.endDate;

      // Find start/end col among Mon-Fri cells (di 0-4)
      let startCol = -1, endCol = -1;
      weekDays.slice(0,5).forEach((d, i) => {
        const dk = dateKey(d);
        if (startCol < 0 && dk >= clampStart) startCol = i;
        if (dk <= clampEnd) endCol = i;
      });
      if (startCol < 0) startCol = 0;
      if (endCol   < 0) endCol   = 4;

      let rowIdx = barRows.findIndex(r => r < startCol);
      if (rowIdx < 0) { rowIdx = barRows.length; barRows.push(endCol); }
      else { barRows[rowIdx] = endCol; }

      const initials = getJobInitials(job.client, clampStart, clampEnd);
      return { job, startCol, endCol, rowIdx, initials };
    });

    const barH = 22, barGap = 3, barTopOffset = 20; // 20px below day number

    // Expand row min-height to fit bars
    const neededH = barTopOffset + barRows.length * (barH + barGap) + 6;
    if (neededH > 80) weekRow.style.minHeight = neededH + "px";

    requestAnimationFrame(() => {
      const allCells = weekRow.querySelectorAll(".month-day-cell");
      if (!allCells.length) return;
      const rowRect = weekRow.getBoundingClientRect();

      placements.forEach(({ job, startCol, endCol, rowIdx, initials }) => {
        const startCell = allCells[startCol];
        const endCell   = allCells[endCol];
        if (!startCell || !endCell) return;

        const startRect = startCell.getBoundingClientRect();
        const endRect   = endCell.getBoundingClientRect();

        const left   = startRect.left - rowRect.left + 3;
        const width  = endRect.right  - startRect.left - 6;
        const top    = barTopOffset + rowIdx * (barH + barGap);

        const bar = document.createElement("div");
        bar.className = "month-job-bar";
        bar.style.left   = left  + "px";
        bar.style.width  = width + "px";
        bar.style.top    = top   + "px";
        bar.style.height = barH  + "px";

        const inner = document.createElement("div");
        inner.className = "month-job-bar-inner";

        const nameEl = document.createElement("span");
        nameEl.className = "month-job-bar-name";
        nameEl.textContent = job.client;
        inner.appendChild(nameEl);

        if (initials) {
          const initEl = document.createElement("span");
          initEl.className = "month-job-bar-initials";
          initEl.textContent = initials;
          inner.appendChild(initEl);
        }

        bar.appendChild(inner);
        weekRow.appendChild(bar);
      });
    });
  });

  outer.appendChild(grid);
}

// ── TWO-WEEK RENDER ──
function getWeekDates(monday) {
  return Array.from({length:5}, (_,i) => addDays(monday, i));
}

function cardsForEmpWeek(emp, weekDates) {
  const weekStart = dateKey(weekDates[0]);
  const weekEnd   = dateKey(weekDates[4]);
  return cards.filter(c =>
    c.emp === emp &&
    c.startDate <= weekEnd &&
    c.endDate   >= weekStart
  );
}

function renderBoard() {
  const outer = document.getElementById("board-outer");
  outer.innerHTML = "";

  const w1Mon = anchorMonday;
  const w2Mon = addDays(anchorMonday, 7);

  document.getElementById("nav-label").textContent =
    fmt(w1Mon) + " - " + fmt(addDays(w2Mon, 4));

  [{label:"Week 1", dates: getWeekDates(w1Mon)},
   {label:"Week 2", dates: getWeekDates(w2Mon)}
  ].forEach(({label, dates}) => {
    const weekBlock = document.createElement("div");
    weekBlock.className = "week-block";

    const wLabel = document.createElement("div");
    wLabel.className = "week-label";
    wLabel.textContent = label;
    weekBlock.appendChild(wLabel);

    const grid = document.createElement("div");
    grid.className = "grid-wrap";

    const corner = document.createElement("div");
    corner.className = "row-label-header";
    grid.appendChild(corner);

    dates.forEach((d, i) => {
      const dh = document.createElement("div");
      dh.className = "day-header" + (isToday(d) ? " is-today" : "");
      dh.innerHTML = `<div class="day-name">${DAYS[i]}</div><div class="day-date">${fmt(d)}</div>`;
      grid.appendChild(dh);
    });

    getEmployees().forEach((emp, empIdx) => {
      const isLast = empIdx === getEmployees().length - 1;
      const floaterIdx = empIdx - FIXED_EMPLOYEES.length;
      const isFloater = floaterIdx >= 0;

      const rowLabel = document.createElement("div");
      rowLabel.className = "row-label" + (isLast ? " emp-row-last-label" : "");
      if (isLast) rowLabel.style.borderBottom = "none";
      rowLabel.textContent = emp;

      if (isFloater) {
        rowLabel.title = "Double-click to rename";
        rowLabel.style.cursor = "text";
        rowLabel.addEventListener("dblclick", () => startInlineEdit(rowLabel, floaterIdx));
      }

      grid.appendChild(rowLabel);

      const cells = [];
      dates.forEach((d, di) => {
        const dk = dateKey(d);
        const cell = document.createElement("div");
        cell.className = "day-cell" + (isToday(d) ? " is-today" : "");
        if (isLast) cell.style.borderBottom = "none";
        if (di === 4) cell.style.borderRight = "none";
        cell.dataset.emp = emp;
        cell.dataset.day = dk;
        cell.dataset.col = di;

        cell.addEventListener("click", e => {
          if (e.target.closest(".scard")) return;
          openAddModal(emp, dk);
        });
        cell.addEventListener("dragover", e => { e.preventDefault(); cell.classList.add("drag-over"); });
        cell.addEventListener("dragleave", () => cell.classList.remove("drag-over"));
        cell.addEventListener("drop", e => {
          e.preventDefault();
          cell.classList.remove("drag-over");
          const id = e.dataTransfer.getData("card-id");
          const card = cards.find(c => c.id === id);
          if (!card) return;
          const dur = daysBetween(card.startDate, card.endDate);
          card.emp = cell.dataset.emp;
          card.startDate = dk;
          card.endDate = dateKey(addDays(fromKey(dk), dur));
          saveState(); renderBoard(); toast("Card moved.");
        });

        grid.appendChild(cell);
        cells.push({el: cell, date: d, dk, col: di});
      });

      const empCards = cardsForEmpWeek(emp, dates);
      const colStackTop = [0,0,0,0,0];

      empCards.forEach(card => {
        const weekStart = dateKey(dates[0]);
        const weekEnd   = dateKey(dates[4]);
        const visStart = card.startDate < weekStart ? weekStart : card.startDate;
        const visEnd   = card.endDate   > weekEnd   ? weekEnd   : card.endDate;
        const startCol = dates.findIndex(d => dateKey(d) === visStart);
        const endCol   = dates.findIndex(d => dateKey(d) === visEnd);
        if (startCol < 0 || endCol < 0) return;
        const startCell = cells[startCol];
        if (!startCell) return;

        const el = buildScardEl(card, startCol, endCol);
        el.style.left  = "4px";
        el.style.top   = (4 + colStackTop[startCol]) + "px";
        el.style.right = "";
        startCell.el.appendChild(el);

        requestAnimationFrame(() => {
          let totalWidth = 0;
          for (let c = startCol; c <= endCol; c++) totalWidth += cells[c].el.getBoundingClientRect().width;
          el.style.width = (totalWidth - 8) + "px";
        });

        const cardH = 44;
        for (let c = startCol; c <= endCol; c++) colStackTop[c] += cardH + 3;
        const maxStack = Math.max(...colStackTop.slice(startCol, endCol+1));
        for (let c = startCol; c <= endCol; c++) {
          const cellEl = cells[c].el;
          const currentMin = parseInt(cellEl.style.minHeight) || 80;
          if (maxStack + 8 > currentMin) cellEl.style.minHeight = (maxStack + 8) + "px";
        }
      });
    });

    weekBlock.appendChild(grid);
    outer.appendChild(weekBlock);
    renderJobStrip(weekBlock, dates);
  });

  setTimeout(() => {
    document.querySelectorAll(".scard[data-startcol][data-endcol]").forEach(el => {
      const startCol = parseInt(el.dataset.startcol);
      const endCol   = parseInt(el.dataset.endcol);
      const grid     = el.closest(".grid-wrap");
      if (!grid) return;
      const allCells = grid.querySelectorAll(".day-cell");
      const startCell = el.parentElement;
      const startIdx  = Array.from(allCells).indexOf(startCell);
      if (startIdx < 0) return;
      const rowStart = Math.floor(startIdx / 5) * 5;
      let totalWidth = 0;
      for (let c = startCol; c <= endCol; c++) {
        const cellEl = allCells[rowStart + c];
        if (cellEl) totalWidth += cellEl.getBoundingClientRect().width;
      }
      el.style.width = (totalWidth - 8) + "px";
    });
  }, 50);
}

function buildScardEl(card, startCol, endCol) {
  const el = document.createElement("div");
  el.className = "scard scard-" + card.type;
  el.draggable = true;
  el.dataset.id = card.id;
  el.dataset.startcol = startCol;
  el.dataset.endcol = endCol;

  const dur = daysBetween(card.startDate, card.endDate);
  const spanLabel = dur > 0 ? `${dur+1}d` : "";

  if (card.type === "off") {
    el.innerHTML =
      `<span class="scard-name">Off</span>` +
      (spanLabel ? `<span class="scard-span">${spanLabel}</span>` : "") +
      `<div class="scard-btns">` +
        `<button class="scard-btn edit-btn" title="Edit">&#9998;</button>` +
        `<button class="scard-btn del-btn" title="Remove">&#x2715;</button>` +
      `</div>`;
  } else {
    el.innerHTML =
      `<span class="scard-name">${card.client || ""}</span>` +
      (card.desc ? `<span class="scard-desc">${card.desc}</span>` : "") +
      (spanLabel ? `<span class="scard-span">${spanLabel}</span>` : "") +
      `<div class="scard-btns">` +
        `<button class="scard-btn edit-btn" title="Edit">&#9998;</button>` +
        `<button class="scard-btn del-btn" title="Remove">&#x2715;</button>` +
      `</div>`;
  }

  el.querySelector(".edit-btn").addEventListener("click", e => { e.stopPropagation(); openEditModal(card.id); });
  el.querySelector(".del-btn").addEventListener("click", e => { e.stopPropagation(); openDeleteModal(card.id); });

  el.addEventListener("dragstart", e => {
    e.dataTransfer.setData("card-id", card.id);
    setTimeout(() => el.classList.add("dragging"), 0);
  });
  el.addEventListener("dragend", () => el.classList.remove("dragging"));

  el.addEventListener("click", e => {
    e.stopPropagation();
    if (e.target.closest(".scard-btn")) return;
    document.querySelectorAll(".scard.selected").forEach(s => s.classList.remove("selected"));
    el.classList.add("selected");
    selectedCardId = card.id;
    copiedCard = null;
  });

  el.addEventListener("dblclick", e => { e.stopPropagation(); openEditModal(card.id); });

  return el;
}

// ── TYPE TOGGLE ──
let activeType = "shop";

function setType(t) {
  activeType = t;
  ["shop","site","off"].forEach(type => {
    document.getElementById("tbtn-" + type).className =
      "type-btn" + (type === t ? " active-" + type : "");
  });
  const isOff = t === "off";
  document.getElementById("client-row").style.display = isOff ? "none" : "";
  document.getElementById("desc-row").style.display   = isOff ? "none" : "";
}

document.querySelectorAll(".type-btn").forEach(btn => {
  btn.addEventListener("click", () => setType(btn.dataset.type));
});

// ── CLIENT DATALIST ──
function populateClientDatalist() {
  const dl = document.getElementById("client-list");
  dl.innerHTML = "";
  prodClients.forEach(name => {
    const opt = document.createElement("option");
    opt.value = name;
    dl.appendChild(opt);
  });
}

// ── ADD MODAL ──
function openAddModal(emp, dayKey) {
  editId = null;
  addContext = {emp, dayKey};
  document.getElementById("modal-card-title").textContent = `Add -- ${emp}`;
  document.getElementById("modal-client").value = "";
  document.getElementById("modal-desc").value = "";
  setType("shop");
  document.getElementById("modal-start").value = dayKey;
  document.getElementById("modal-end").value = dayKey;
  populateClientDatalist();
  document.getElementById("modal-card").classList.add("open");
  setTimeout(() => document.getElementById("modal-client").focus(), 60);
}

// ── EDIT MODAL ──
function openEditModal(id) {
  const card = cards.find(c => c.id === id);
  if (!card) return;
  editId = id;
  addContext = null;
  document.getElementById("modal-card-title").textContent = `Edit -- ${card.emp}`;
  setType(card.type);
  document.getElementById("modal-client").value = card.client || "";
  document.getElementById("modal-desc").value   = card.desc   || "";
  document.getElementById("modal-start").value  = card.startDate;
  document.getElementById("modal-end").value    = card.endDate;
  populateClientDatalist();
  document.getElementById("modal-card").classList.add("open");
}

document.getElementById("modal-card-cancel").addEventListener("click", () => {
  document.getElementById("modal-card").classList.remove("open");
});
document.getElementById("modal-card").addEventListener("click", e => {
  if (e.target === document.getElementById("modal-card"))
    document.getElementById("modal-card").classList.remove("open");
});

document.getElementById("modal-start").addEventListener("change", () => {
  const s = document.getElementById("modal-start").value;
  const e = document.getElementById("modal-end").value;
  if (e < s) document.getElementById("modal-end").value = s;
});
document.getElementById("modal-end").addEventListener("change", () => {
  const s = document.getElementById("modal-start").value;
  const e = document.getElementById("modal-end").value;
  if (e < s) document.getElementById("modal-end").value = s;
});

document.getElementById("modal-card-save").addEventListener("click", () => {
  const type      = activeType;
  const client    = document.getElementById("modal-client").value.trim();
  const desc      = document.getElementById("modal-desc").value.trim();
  const startDate = document.getElementById("modal-start").value;
  let   endDate   = document.getElementById("modal-end").value;
  if (!startDate) return;
  if (!endDate || endDate < startDate) endDate = startDate;

  if (type !== "off" && !client) {
    document.getElementById("modal-client").focus();
    return;
  }

  if (editId) {
    const card = cards.find(c => c.id === editId);
    if (card) Object.assign(card, {type, client: type==="off"?"":client, desc: type==="off"?"":desc, startDate, endDate});
    toast("Assignment updated.");
  } else {
    cards.push({ id: uid(), emp: addContext.emp, type,
      client: type === "off" ? "" : client,
      desc:   type === "off" ? "" : desc,
      startDate, endDate });
    toast("Assignment added.");
  }

  saveState();
  if (currentView === "2week") renderBoard(); else renderMonth();
  document.getElementById("modal-card").classList.remove("open");
});

document.getElementById("modal-client").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("modal-desc").focus();
  if (e.key === "Escape") document.getElementById("modal-card-cancel").click();
});
document.getElementById("modal-desc").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("modal-card-save").click();
  if (e.key === "Escape") document.getElementById("modal-card-cancel").click();
});

// ── DELETE ──
let deleteId = null;

function openDeleteModal(id) {
  deleteId = id;
  const card = cards.find(c => c.id === id);
  const label = card.type === "off" ? "Off" : (card.client || "this assignment");
  document.getElementById("modal-delete-msg").textContent =
    `Remove "${label}" for ${card.emp}? This can't be undone.`;
  document.getElementById("modal-delete").classList.add("open");
}

document.getElementById("modal-delete-cancel").addEventListener("click", () => {
  document.getElementById("modal-delete").classList.remove("open");
  deleteId = null;
});
document.getElementById("modal-delete-confirm").addEventListener("click", () => {
  if (deleteId) {
    cards = cards.filter(c => c.id !== deleteId);
    saveState();
    if (currentView === "2week") renderBoard(); else renderMonth();
    toast("Assignment removed.");
  }
  document.getElementById("modal-delete").classList.remove("open");
  deleteId = null;
});
document.getElementById("modal-delete").addEventListener("click", e => {
  if (e.target === document.getElementById("modal-delete")) {
    document.getElementById("modal-delete").classList.remove("open");
    deleteId = null;
  }
});

// ── CLIENT MANAGER ──
function renderClientManager() {
  const wrap = document.getElementById("client-list-wrap");
  wrap.innerHTML = "";
  if (prodClients.length === 0) {
    wrap.innerHTML = `<div class="client-empty">No clients yet. Import from the production board to add names.</div>`;
    return;
  }
  prodClients.slice().sort().forEach(name => {
    const row = document.createElement("div");
    row.className = "client-list-item";
    row.innerHTML = `<span>${name}</span>`;
    const btn = document.createElement("button");
    btn.className = "client-del-btn";
    btn.innerHTML = "&#x2715;";
    btn.title = "Remove";
    btn.addEventListener("click", () => {
      prodClients = prodClients.filter(n => n !== name);
      saveState(); renderClientManager(); populateClientDatalist();
      toast(`"${name}" removed from client list.`);
    });
    row.appendChild(btn);
    wrap.appendChild(row);
  });
}

document.getElementById("btn-manage-clients").addEventListener("click", () => {
  renderClientManager();
  document.getElementById("modal-clients").classList.add("open");
});
document.getElementById("modal-clients-close").addEventListener("click", () => {
  document.getElementById("modal-clients").classList.remove("open");
});
document.getElementById("modal-clients").addEventListener("click", e => {
  if (e.target === document.getElementById("modal-clients"))
    document.getElementById("modal-clients").classList.remove("open");
});

// ── JOB STRIP TOGGLE ──
document.getElementById("btn-toggle-jobs").addEventListener("click", () => {
  showJobStrip = !showJobStrip;
  const btn = document.getElementById("btn-toggle-jobs");
  btn.textContent = showJobStrip ? "Hide jobs" : "Show jobs";
  btn.classList.toggle("active", !showJobStrip);
  renderBoard();
});

// ── TWO-WEEK NAV ──
document.getElementById("btn-prev").addEventListener("click", () => {
  anchorMonday = addDays(anchorMonday, -7);
  saveState(); renderBoard();
});
document.getElementById("btn-next").addEventListener("click", () => {
  anchorMonday = addDays(anchorMonday, 7);
  saveState(); renderBoard();
});
document.getElementById("btn-today").addEventListener("click", () => {
  anchorMonday = getMondayOf(new Date());
  saveState(); renderBoard();
});

// ── MONTH NAV ──
document.getElementById("btn-month-prev").addEventListener("click", () => {
  monthAnchor.month--;
  if (monthAnchor.month < 0) { monthAnchor.month = 11; monthAnchor.year--; }
  renderMonth();
});
document.getElementById("btn-month-next").addEventListener("click", () => {
  monthAnchor.month++;
  if (monthAnchor.month > 11) { monthAnchor.month = 0; monthAnchor.year++; }
  renderMonth();
});
document.getElementById("btn-month-today").addEventListener("click", () => {
  const n = new Date();
  monthAnchor = { year: n.getFullYear(), month: n.getMonth() };
  renderMonth();
});

// ── JSON SAVE ──
document.getElementById("btn-save-json").addEventListener("click", async () => {
  try {
    const snap = await getDoc(DOC_REF);
    const s = snap.exists() ? snap.data() : {cards, prodClients, anchorMonday: dateKey(anchorMonday)};
    const blob = new Blob([JSON.stringify(s, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "schedule_" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
    toast("Schedule saved.");
  } catch(e) { toast("Could not download -- check connection."); }
});

// ── JSON RESTORE ──
document.getElementById("btn-load-json").addEventListener("click", () => document.getElementById("file-json").click());
document.getElementById("file-json").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const s = JSON.parse(ev.target.result);
      cards = s.cards || [];
      prodClients = s.prodClients || [];
      floaterNames = s.floaterNames || [...FLOATER_DEFAULTS];
      if (s.anchorMonday) anchorMonday = fromKey(s.anchorMonday);
      await setDoc(DOC_REF, { cards, prodClients, floaterNames, anchorMonday: dateKey(anchorMonday) });
      if (currentView === "2week") renderBoard(); else renderMonth();
      toast("Schedule restored.");
    } catch(err) { alert("Could not read that file."); }
    e.target.value = "";
  };
  reader.readAsText(file);
});

// ── PROD BOARD IMPORT ──
document.getElementById("btn-import-prod").addEventListener("click", () => document.getElementById("file-prod").click());
document.getElementById("file-prod").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const state = JSON.parse(ev.target.result);
      const existing = new Set(prodClients);
      let added = 0;
      Object.values(state).forEach(zone => {
        if (!Array.isArray(zone)) return;
        zone.forEach(card => {
          if (card.name && !existing.has(card.name)) {
            existing.add(card.name); prodClients.push(card.name); added++;
          }
        });
      });
      prodClients.sort();
      await setDoc(DOC_REF, { cards, prodClients, floaterNames, anchorMonday: dateKey(anchorMonday) });
      populateClientDatalist();
      toast(`${added} new client${added !== 1 ? "s" : ""} added from production board.`);
    } catch(err) { alert("Could not read that file. Make sure it's a production board JSON export."); }
    e.target.value = "";
  };
  reader.readAsText(file);
});

// ── FLOATER INLINE EDIT ──
function startInlineEdit(labelEl, floaterIdx) {
  const currentName = floaterNames[floaterIdx];
  const input = document.createElement("input");
  input.type = "text";
  input.value = currentName;
  input.style.cssText = "width:100%;font:inherit;font-size:12px;font-weight:600;color:inherit;background:transparent;border:none;border-bottom:1.5px solid var(--border-strong);outline:none;padding:0;";
  labelEl.textContent = "";
  labelEl.appendChild(input);
  input.focus(); input.select();

  function commit() {
    const newName = input.value.trim() || currentName;
    const oldName = floaterNames[floaterIdx];
    cards.forEach(c => { if (c.emp === oldName) c.emp = newName; });
    floaterNames[floaterIdx] = newName;
    saveState(); renderBoard();
    toast(`Row renamed to "${newName}".`);
  }

  input.addEventListener("blur", commit);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); input.blur(); }
    if (e.key === "Escape") { input.value = currentName; input.blur(); }
  });
}

// ── COPY / PASTE ──
let selectedCardId = null;
let copiedCard = null;

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "c") {
    if (!selectedCardId) return;
    const card = cards.find(c => c.id === selectedCardId);
    if (!card) return;
    copiedCard = {...card};
    document.getElementById("board-outer").classList.add("paste-ready");
    toast("Card copied -- click a cell to paste.");
    return;
  }
  if (e.key === "Escape") {
    selectedCardId = null; copiedCard = null;
    document.querySelectorAll(".scard.selected").forEach(s => s.classList.remove("selected"));
    document.getElementById("board-outer").classList.remove("paste-ready");
  }
});

document.getElementById("board-outer").addEventListener("click", e => {
  if (!copiedCard) return;
  const cell = e.target.closest(".day-cell");
  if (!cell) return;
  if (e.target.closest(".scard")) return;
  const newCard = {
    ...copiedCard, id: uid(),
    emp: cell.dataset.emp,
    startDate: cell.dataset.day,
    endDate: dateKey(addDays(fromKey(cell.dataset.day), daysBetween(copiedCard.startDate, copiedCard.endDate))),
  };
  cards.push(newCard);
  saveState(); renderBoard();
  document.querySelectorAll(".scard.selected").forEach(s => s.classList.remove("selected"));
  selectedCardId = null;
  toast(`Pasted "${newCard.type === "off" ? "Off" : newCard.client}" for ${newCard.emp}.`);
});

// ── INIT ──
(async () => {
  toast("Loading schedule...");
  await loadState();
  renderBoard();
  toast("Schedule loaded.");
})();

window.addEventListener("resize", () => {
  clearTimeout(window._resizeTo);
  window._resizeTo = setTimeout(() => {
    if (currentView === "2week") renderBoard(); else renderMonth();
  }, 120);
});
</script>
